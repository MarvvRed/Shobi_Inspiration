name: Analyze validated note slot patterns

on:
  push:
    paths:
      - 'tools/analyze_validated_note_slot_patterns.py'
      - '.github/workflows/analyze-validated-note-slot-patterns.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/analyze_validated_note_slot_patterns.py
      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validated-note-slot-patterns.json validated-note-slot-patterns.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Analyze validated Social Card note slot patterns"
          git pull --rebase origin main
          git push origin HEAD:main
