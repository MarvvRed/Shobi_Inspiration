name: Audit Catalog Duplicates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/catalog-duplicate-audit-trigger'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit all duplicate signals
        run: python tools/audit_catalog_duplicates.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-duplicate-audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit all catalog duplicates"
          git pull --rebase origin main
          git push origin HEAD:main
