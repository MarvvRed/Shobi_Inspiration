name: Analyze season yellows

on:
  push:
    paths:
      - tools/analyze_season_yellows.py
      - .github/workflows/analyze-season-yellows.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/analyze_season_yellows.py
      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/audits/season-yellow-analysis.json database/audits/season-yellow-analysis.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish season yellow analysis"
          git pull --rebase origin main
          git push
