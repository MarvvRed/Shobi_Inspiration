name: Recover missing cards from URL corpus now

on:
  push:
    paths:
      - '.github/workflows/recover-missing-cards-from-url-corpus-now.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/recover_missing_social_cards_from_url_corpus.py
      - name: Commit evidence report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-card-corpus-recovery-report.json fragrantica-scraper-archive/social-cards/images
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Analyze missing Social Cards against URL corpus"
          git pull --rebase origin main
          git push origin HEAD:main
