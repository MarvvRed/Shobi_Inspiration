name: Full Catalog Integrity Audit
on:
  workflow_dispatch:
  push:
    paths:
      - tools/audit_catalog_integrity_full.py
      - .github/workflows/audit-catalog-integrity-full.yml
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/audit_catalog_integrity_full.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-integrity-full-audit.md
          git diff --cached --quiet || git commit -m "Update full catalog integrity audit"
          git push