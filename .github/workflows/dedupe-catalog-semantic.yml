name: Semantic Catalog Duplicate Cleanup
on:
  push:
    paths:
      - '.github/catalog-semantic-dedupe-trigger'
permissions:
  contents: write
jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove verified semantic duplicates
        run: python tools/dedupe_catalog_semantic.py
      - name: Commit cleaned catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database_complete.json catalog-semantic-dedupe-report.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove verified semantic perfume duplicates"
          git pull --rebase origin main
          git push origin HEAD:main
