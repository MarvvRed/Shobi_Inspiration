name: Fix image-season yellow rows

on:
  push:
    paths:
      - 'tools/fix_image_season_rows.py'
      - '.github/workflows/fix-image-season-rows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Recover exact images and seasons
        run: python tools/fix_image_season_rows.py
      - name: Rebuild strict validation
        run: python tools/build_validation_audit.py
      - name: Refresh yellow report
        run: python tools/analyze_validation_yellows.py
      - name: Commit recovered image-season rows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database_complete.json catalog_site.json perfume-images/map.js perfume-images/*.avif fragrantica-scraper-archive/social-cards/gender-season.csv image-season-recovery.json validation-yellow-report.json validation-yellow-report.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Recover images and seasons for exact-ID rows"
          git pull --rebase origin main
          git push origin HEAD:main
