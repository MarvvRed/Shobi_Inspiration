name: Build Shobi Master v2

on:
  push:
    paths:
      - '.github/build-shobi-master-v2-trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build verified master v2
        run: python tools/build_shobi_master_v2.py
      - name: Commit master v2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add perfume-database/catalog/shobi-master-v2-2369.csv perfume-database/catalog/SHOBI-MASTER-V2-STATUS.md
          git diff --cached --quiet || git commit -m 'Promote verified 2369-row Shobi master v2'
          git pull --rebase origin main
          git push origin main
