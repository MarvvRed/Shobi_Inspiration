name: Audit pending Shobi product IDs and social cards
on:
  push:
    paths:
      - '.github/workflows/audit-shobi-candidate-ids.yml'
      - 'tools/audit_shobi_candidate_product_ids.py'
      - 'tools/audit_pending_shobi_social_cards.py'
      - 'database/audits/pending-shobi-additions-2026-10-19.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-pending-shobi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser and HTTP client
        run: python -m pip install requests beautifulsoup4
      - name: Recover official product IDs
        run: python tools/audit_shobi_candidate_product_ids.py
      - name: Download and validate candidate social-card JPEGs
        run: python tools/audit_pending_shobi_social_cards.py
      - name: Upload audit report and card images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shobi-social-card-audit
          path: |
            database/audits/recovered-shobi-product-ids-2026-10-19.json
            database/audits/shobi-pending-social-card-download-2026-10-19.json
            artifacts/shobi-pending-social-cards/*.jpeg
          if-no-files-found: warn
          retention-days: 30
