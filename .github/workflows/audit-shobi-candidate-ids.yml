name: Audit pending Shobi product IDs
on:
  push:
    paths:
      - '.github/workflows/audit-shobi-candidate-ids.yml'
      - 'tools/audit_shobi_candidate_product_ids.py'
      - 'database/audits/pending-shobi-additions-2026-10-19.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-product-ids:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser and HTTP client
        run: python -m pip install requests beautifulsoup4
      - name: Recover official product IDs
        run: python tools/audit_shobi_candidate_product_ids.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shobi-product-id-audit
          path: database/audits/recovered-shobi-product-ids-2026-10-19.json
          if-no-files-found: warn
          retention-days: 30
