name: Connect Perfume Images to Site

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/perfume-images-site-trigger"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build image map and connect cards
        run: python tools/connect_perfume_images_to_site.py

      - name: Commit site integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html perfume-images/map.js
          if git diff --cached --quiet; then
            echo "No perfume image site changes to commit."
            exit 0
          fi
          git commit -m "Use archived perfume images on site"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
