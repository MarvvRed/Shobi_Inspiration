name: Reconcile Catalog Residuals
on:
  push:
    paths:
      - '.github/catalog-residual-reconciliation-trigger'
      - 'tools/reconcile_catalog_residuals.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/reconcile_catalog_residuals.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-residual-reconciliation.md
          git diff --cached --quiet || git commit -m "Update residual catalog reconciliation"
          git pull --rebase origin main
          git push
