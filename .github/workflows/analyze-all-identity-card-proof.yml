name: Analyze all remaining identity card proof

on:
  push:
    paths:
      - 'tools/analyze_all_identity_card_proof.py'
      - '.github/workflows/analyze-all-identity-card-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/analyze_all_identity_card_proof.py
      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/audits/all-identity-card-proof.json database/audits/all-identity-card-proof.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish strict identity proof for remaining yellows"
          git pull --rebase origin main
          git push origin HEAD:main
