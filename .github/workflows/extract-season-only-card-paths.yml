name: Extract season-only card paths

on:
  push:
    paths:
      - tools/extract_season_only_card_paths.py
      - .github/workflows/extract-season-only-card-paths.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/extract_season_only_card_paths.py
      - name: Publish paths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add season-only-card-paths.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish season-only Social Card paths"
          git pull --rebase origin main
          git push
