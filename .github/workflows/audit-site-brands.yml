name: Audit site brands

on:
  push:
    paths:
      - 'tools/audit_site_brands.py'
      - 'tools/audit_brand_sources.py'
      - 'tools/audit_brand_recovery.py'
      - '.github/workflows/audit-site-brands.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/audit_site_brands.py
      - run: python tools/audit_brand_sources.py
      - run: python tools/audit_brand_recovery.py
      - name: Commit audit reports
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site-brand-audit.md brand-source-audit.md brand-recovery-audit.md
          git diff --cached --quiet || git commit -m "Report deterministic brand recovery"
          git push
