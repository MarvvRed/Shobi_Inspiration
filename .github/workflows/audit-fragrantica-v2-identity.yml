name: Audit Fragrantica v2 Identity
on:
  push:
    paths:
      - '.github/audit-fragrantica-v2-identity-trigger'
      - 'tools/audit_fragrantica_v2_identity.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/audit_fragrantica_v2_identity.py
      - name: Commit reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fragrantica-v2-identity-audit.csv fragrantica-v2-identity-audit.md fragrantica-v2-unmapped.csv
          git diff --cached --quiet || git commit -m 'Audit Fragrantica v2 identity consistency'
          git pull --rebase origin main
          git push origin main
