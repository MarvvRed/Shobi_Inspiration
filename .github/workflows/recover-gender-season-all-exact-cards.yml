name: Recover gender and season from all exact cards

on:
  push:
    paths:
      - 'tools/recover_gender_season_all_exact_cards.py'
      - '.github/workflows/recover-gender-season-all-exact-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m pip install pillow pytesseract
      - name: Recover exact-card gender and season evidence
        run: python tools/recover_gender_season_all_exact_cards.py
      - name: Rebuild strict validation
        run: python tools/build_validation_audit.py
      - name: Refresh yellow report
        run: python tools/analyze_validation_yellows.py
      - name: Commit recovered evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database_complete.json catalog_site.json fragrantica-scraper-archive/social-cards/gender-season.csv all-exact-card-gender-season-recovery.json validation-yellow-report.json validation-yellow-report.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Recover gender and season from exact-ID Social Cards"
          git pull --rebase origin main
          git push origin HEAD:main
