name: Audit Perfume Only Catalog
on:
  push:
    paths:
      - '.github/perfume-only-audit-trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/audit_perfume_only_catalog.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-perfume-only-audit.md
          git diff --cached --quiet || git commit -m "Audit catalog for non-perfume products"
          git pull --rebase origin main
          git push origin main
