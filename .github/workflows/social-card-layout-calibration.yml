name: Social card layout calibration
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/make_social_card_layout_calibration.py'
      - '.github/workflows/social-card-layout-calibration.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python tools/make_social_card_layout_calibration.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add social-card-layout-calibration.jpg
          if ! git diff --cached --quiet; then git commit -m "Add social card layout calibration" && git push; fi
