name: Promote Fragrantica v2 Verified
on:
  push:
    paths:
      - '.github/promote-fragrantica-v2-verified-trigger'
      - 'tools/promote_fragrantica_v2_verified.py'
      - 'data/fragrantica-v2-web-verified.csv'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/promote_fragrantica_v2_verified.py
      - name: Commit verified mappings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database_complete.json database_v2_clean.json fragrantica-v2-promotion.md
          git diff --cached --quiet || git commit -m 'Promote verified Fragrantica v2 mappings'
          git pull --rebase origin main
          git push origin main
