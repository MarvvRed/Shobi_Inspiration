name: Analyze current yellow validation rows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/analyze_current_yellows.py'
      - '.github/workflows/analyze-current-yellows.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - name: Classify yellow rows
        run: python tools/analyze_current_yellows.py
      - name: Publish yellow breakdown
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/audits/current-yellow-breakdown.json
          if git diff --cached --quiet; then
            echo 'No yellow breakdown changes.'
            exit 0
          fi
          git commit -m 'Publish current yellow validation breakdown'
          git pull --rebase origin main
          git push origin main
