name: Apply Shared FID Fixes
on:
  push:
    paths:
      - 'tools/apply_shared_fid_fixes.py'
      - '.github/workflows/apply-shared-fid-fixes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_shared_fid_fixes.py
      - name: Commit corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add database_complete.json database_v2_clean.json
          git diff --cached --quiet || git commit -m 'Fix verified shared Fragrantica IDs and Main Notes'
          git pull --rebase origin main
          git push origin main
