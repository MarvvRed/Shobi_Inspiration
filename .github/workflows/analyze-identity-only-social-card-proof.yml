name: Analyze identity-only Social Card proof

on:
  push:
    paths:
      - tools/analyze_identity_only_social_card_proof.py
      - .github/workflows/analyze-identity-only-social-card-proof.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze exact Social Card identity proof
        run: python tools/analyze_identity_only_social_card_proof.py
      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add identity-only-social-card-proof.json identity-only-social-card-proof.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish identity-only Social Card proof report"
          git push
