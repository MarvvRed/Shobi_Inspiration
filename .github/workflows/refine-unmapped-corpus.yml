name: Refine unresolved Fragrantica identities
on:
  push:
    paths:
      - 'tools/refine_unmapped_corpus.py'
      - '.github/refine-unmapped-trigger'
  workflow_dispatch:
jobs:
  refine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/refine_unmapped_corpus.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fragrantica-v2-refined-unresolved.csv fragrantica-v2-refined-summary.txt
          git diff --cached --quiet || git commit -m "Refine remaining Fragrantica identity candidates"
          git push
