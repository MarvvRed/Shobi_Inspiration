name: Analyze validation recoverability

on:
  push:
    paths:
      - tools/analyze_validation_recoverability.py
      - .github/workflows/analyze-validation-recoverability.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose recoverable yellow rows
        run: python tools/analyze_validation_recoverability.py
      - name: Publish diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/audits/validation-recoverability-report.json database/audits/validation-recoverability-report.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish validation recoverability report"
          git push
