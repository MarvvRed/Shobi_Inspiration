name: Analyze icon-only yellows

on:
  push:
    paths:
      - 'tools/analyze_icon_only_yellows.py'
      - '.github/workflows/analyze-icon-only-yellows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/analyze_icon_only_yellows.py
      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-only-yellow-analysis.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Report icon-only validation gaps"
          git push origin HEAD:main
