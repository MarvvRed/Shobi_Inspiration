name: Apply missing note icon mappings

on:
  push:
    branches: [main]
    paths:
      - 'database/assets/note-icons/map.js'
      - '.github/workflows/apply-missing-note-icon-mappings.yml'

permissions:
  contents: read

concurrency:
  group: note-icon-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild validation from existing local evidence
        run: |
          python tools/build_validation_audit.py
          python tools/build_final_perfume_catalog.py
          python tools/analyze_current_yellows.py
      - name: Upload targeted validation refresh
        uses: actions/upload-artifact@v4
        with:
          name: targeted-validation-refresh
          if-no-files-found: error
          path: |
            database/catalog/database_complete.json
            database/catalog/catalog_site.json
            database/catalog/catalog_final_perfume_only.json
            database/catalog/database_final_perfume_only.json
            database/catalog/final-perfume-catalog-certification.json
            database/audits/FINAL-PERFUME-CATALOG.md
            database/audits/current-yellow-breakdown.json
