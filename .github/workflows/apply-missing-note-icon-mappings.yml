name: Audit current yellow Social Cards

on:
  push:
    branches: [main]
    paths:
      - 'database/assets/note-icons/map.js'
      - '.github/workflows/apply-missing-note-icon-mappings.yml'

permissions:
  contents: read

concurrency:
  group: targeted-yellow-social-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted OCR requirements
        run: |
          command -v tesseract || (sudo apt-get update && sudo apt-get install -y tesseract-ocr)
          python -m pip install --disable-pip-version-check pillow numpy
      - name: Audit only unresolved Social Cards
        run: |
          SOCIAL_CARD_AUDIT_ONLY_CURRENT_YELLOWS=1 SOCIAL_CARD_AUDIT_WORKERS=2 SOCIAL_CARD_AUDIT_BATCH=27 python tools/audit_social_card_order_from_images.py
          python tools/build_validation_audit.py
          python tools/build_final_perfume_catalog.py
          python tools/analyze_current_yellows.py
      - name: Upload targeted yellow audit
        uses: actions/upload-artifact@v4
        with:
          name: targeted-yellow-social-audit
          if-no-files-found: error
          path: |
            database/fragrantica/social-cards/records/social-card-ordered-image-audit.json
            database/catalog/database_complete.json
            database/catalog/catalog_site.json
            database/catalog/catalog_final_perfume_only.json
            database/catalog/database_final_perfume_only.json
            database/catalog/final-perfume-catalog-certification.json
            database/audits/FINAL-PERFUME-CATALOG.md
            database/audits/current-yellow-breakdown.json
