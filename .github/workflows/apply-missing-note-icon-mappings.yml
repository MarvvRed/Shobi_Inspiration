name: Audit current yellow Social Cards

on:
  push:
    branches: [main]
    paths:
      - 'database/assets/note-icons/map.js'
      - 'tools/audit_social_card_order_from_images.py'
      - 'tools/build_validation_audit.py'
      - '.github/workflows/apply-missing-note-icon-mappings.yml'

permissions:
  contents: write

concurrency:
  group: targeted-yellow-social-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted OCR requirements
        run: |
          command -v tesseract || (sudo apt-get update && sudo apt-get install -y tesseract-ocr)
          python -m pip install --disable-pip-version-check pillow numpy
      - name: Audit only unresolved Social Cards
        run: |
          SOCIAL_CARD_AUDIT_ONLY_CURRENT_YELLOWS=1 SOCIAL_CARD_AUDIT_WORKERS=2 SOCIAL_CARD_AUDIT_BATCH=27 python tools/audit_social_card_order_from_images.py
          python tools/build_validation_audit.py
          python tools/build_final_perfume_catalog.py
          python tools/analyze_current_yellows.py
      - name: Commit exact targeted promotions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No proven yellow-card changes.'
            exit 0
          fi
          git commit -m 'Promote exact current-yellow Social Card proofs'
          git push origin HEAD:main
