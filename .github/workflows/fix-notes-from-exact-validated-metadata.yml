name: Fix notes from exact validated metadata

on:
  push:
    paths:
      - tools/fix_notes_from_exact_validated_metadata.py
      - .github/workflows/fix-notes-from-exact-validated-metadata.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct notes from validated Social Card metadata
        run: python tools/fix_notes_from_exact_validated_metadata.py
      - name: Rebuild strict validation
        run: python tools/build_validation_audit.py
      - name: Refresh reports
        run: |
          python tools/analyze_validation_yellows.py
          python tools/analyze_social_card_note_yellows.py
      - name: Commit validated corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/catalog/database_complete.json database/catalog/catalog_site.json database/audits/exact-validated-note-corrections.json database/audits/validation-yellow-report.json database/audits/validation-yellow-report.md database/fragrantica/social-cards/records/social-card-note-yellow-analysis.json database/audits/social-card-note-yellow-analysis.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Correct Main Notes from exact validated Social Cards"
          git pull --rebase origin main
          git push
