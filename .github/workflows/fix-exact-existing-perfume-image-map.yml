name: Fix exact existing perfume image map

on:
  push:
    paths:
      - tools/fix_exact_existing_perfume_image_map.py
      - .github/workflows/fix-exact-existing-perfume-image-map.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Link exact existing files
        run: python tools/fix_exact_existing_perfume_image_map.py
      - name: Rebuild strict validation
        run: python tools/build_validation_audit.py
      - name: Refresh yellow report
        run: python tools/analyze_validation_yellows.py
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perfume-images/map.js perfume-image-map-fixes.json database_complete.json catalog_site.json validation-yellow-report.json validation-yellow-report.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Link exact existing perfume images"
          git pull --rebase origin main
          git push
