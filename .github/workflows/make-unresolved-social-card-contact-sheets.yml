name: Make unresolved social-card review sheets

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/make_unresolved_social_card_contact_sheets.py'
      - '.github/workflows/make-unresolved-social-card-contact-sheets.yml'
      - 'social-card-main-notes-validated.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Build direct visual review sheets
        run: python tools/make_unresolved_social_card_contact_sheets.py
      - name: Upload review sheets artifact
        uses: actions/upload-artifact@v4
        with:
          name: social-card-note-review
          path: social-card-note-review/
          if-no-files-found: error
          retention-days: 3
      - name: Commit review sheets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add social-card-note-review/
          if ! git diff --cached --quiet; then
            git commit -m "Generate unresolved social-card note review sheets"
            git push
          fi
