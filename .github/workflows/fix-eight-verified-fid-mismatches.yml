name: Fix eight verified Fragrantica ID mismatches

on:
  push:
    paths:
      - 'tools/fix_seven_verified_fid_mismatches.py'
      - '.github/workflows/fix-eight-verified-fid-mismatches.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shobi-validation-writes
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct eight verified FIDs and fetch exact-ID evidence
        run: python tools/fix_seven_verified_fid_mismatches.py
      - name: Rebuild strict validation
        run: python tools/build_validation_audit.py
      - name: Refresh yellow report
        run: python tools/analyze_validation_yellows.py
      - name: Commit verified FID corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Correct eight verified Fragrantica IDs"
          git pull --rebase origin main
          git push origin HEAD:main
