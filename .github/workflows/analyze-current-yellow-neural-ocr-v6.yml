name: Analyze current yellows with neural OCR V6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/analyze_current_yellow_neural_ocr_v6.py'
      - '.github/workflows/analyze-current-yellow-neural-ocr-v6.yml'
      - 'database/catalog/database_complete.json'
      - 'database/fragrantica/social-cards/records/social-card-ordered-image-audit.json'
      - 'database/fragrantica/social-cards/images/current_*'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run independent neural-OCR analysis
        run: |
          python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless paddlepaddle==2.6.2 paddleocr==2.9.1
          python tools/analyze_current_yellow_neural_ocr_v6.py

      - name: Commit analysis report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/audits/current-yellow-neural-ocr-v6.json
          if git diff --cached --quiet; then
            echo 'No V6 report changes.'
            exit 0
          fi
          git commit -m 'Analyze current yellow Social Cards with neural OCR V6'
          git push
