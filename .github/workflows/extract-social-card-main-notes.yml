name: Extract social card main notes

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/extract_social_card_main_notes.py'
      - '.github/workflows/extract-social-card-main-notes.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image/OCR tools
        run: |
          python -m pip install --upgrade pip
          pip install pillow
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Prepare all social-card note labels
        run: python tools/extract_social_card_main_notes.py prepare
      - name: OCR all label-only panels in one Tesseract invocation
        run: |
          mkdir -p .social-card-notes-work
          tesseract .social-card-notes-work/social-note-panels.tiff stdout --psm 11 -l eng tsv > .social-card-notes-work/ocr.tsv
      - name: Parse ordered notes from social-card panel only
        run: python tools/extract_social_card_main_notes.py parse
      - name: Commit extraction results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add social-card-main-notes.json social-card-main-notes-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Refine ordered main notes from Fragrantica social cards"
            git push
          fi
