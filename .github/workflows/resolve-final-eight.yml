name: Resolve final eight Fragrantica identities
on:
  push:
    paths: ['.github/final-eight-trigger']
  workflow_dispatch:
jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/resolve_final_eight.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fragrantica-final-eight-candidates.csv
          git diff --cached --quiet || git commit -m "Resolve final eight Fragrantica candidates"
          git push