name: Fix 1037 Bvlgari Man gender season

on:
  push:
    paths:
      - 'tools/fix_1037_bvlgari_man_gender_season.py'
      - '.github/workflows/fix-1037-bvlgari-man-gender-season.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python tools/fix_1037_bvlgari_man_gender_season.py
      - run: python tools/build_validation_audit.py
      - run: python tools/report_validation_yellows.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database_complete.json catalog_site.json fragrantica-scraper-archive/social-cards/gender-season.csv fix-1037-bvlgari-man-gender-season.json validation-yellow-report.md validation-yellow-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Validate Bvlgari Man gender and season from exact card"
          git pull --rebase origin main
          git push origin HEAD:main
