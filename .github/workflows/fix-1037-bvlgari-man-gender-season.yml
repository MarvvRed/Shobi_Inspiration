name: Fix 1037 Bvlgari Man gender season

on:
  push:
    paths:
      - 'tools/fix_1037_bvlgari_man_gender_season.py'
      - '.github/workflows/fix-1037-bvlgari-man-gender-season.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python tools/fix_1037_bvlgari_man_gender_season.py
      - run: python tools/build_validation_audit.py
      - name: Record validation counts
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          rows=json.load(open('database/catalog/catalog_site.json',encoding='utf-8-sig'))
          counts=Counter(str(x.get('validationStatus') or '').lower() for x in rows)
          out={'catalogRows':len(rows),'green':counts['green'],'yellow':counts['yellow'],'red':counts['red']}
          open('database/audits/current-validation-counts.json','w',encoding='utf-8').write(json.dumps(out,indent=2)+'\n')
          print(out)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/catalog/database_complete.json database/catalog/catalog_site.json database/fragrantica/social-cards/gender-season.csv database/audits/fix-1037-bvlgari-man-gender-season.json database/audits/current-validation-counts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Validate Bvlgari Man gender and season from exact card"
          git pull --rebase origin main
          git push origin HEAD:main
