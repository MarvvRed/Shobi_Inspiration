name: Count official site catalog
on:
  push:
    paths:
      - '.github/workflows/count-official-site-catalog.yml'
      - 'tools/count_official_site_catalog.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/count_official_site_catalog.py
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site-official-count.md
          git diff --cached --quiet || git commit -m "Report official site catalog count"
          git push
