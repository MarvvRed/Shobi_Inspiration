name: Summarize current-yellow V2 review failures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/summarize_current_yellow_v2_review.py'
      - '.github/workflows/summarize-current-yellow-v2-review.yml'

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Summarize review failure modes
        run: python tools/summarize_current_yellow_v2_review.py
      - name: Commit summary report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/audits/current-yellow-v2-review-summary.json
          if git diff --cached --quiet; then
            echo 'No review summary changes.'
            exit 0
          fi
          git commit -m 'Publish current-yellow V2 review summary'
          git pull --rebase origin main
          git push origin main
