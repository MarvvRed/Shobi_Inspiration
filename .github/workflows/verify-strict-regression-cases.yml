name: Verify strict validation regression cases

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-strict-regression-cases.yml'
      - 'tools/verify_catalog_invariants.py'
      - 'tools/build_validation_audit.py'
      - 'tools/audit_social_card_order_from_images.py'
      - 'tools/apply_strict_ordered_card_audit.py'
      - 'database/catalog/**'
      - 'database/source/**'
      - 'database/fragrantica/social-cards/records/**'
      - 'database/audits/identity-change-allowlist.json'
      - 'database/audits/critical-identity-fixes.json'
      - 'database/audits/critical-identity-regression-registry.json'
      - 'database/audits/shared-fid-alias-registry.json'

concurrency:
  group: shobi-catalog-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all green invariants, FIDs and identity regressions
        run: python tools/verify_catalog_invariants.py --baseline-ref HEAD^ --write-report
      - name: Verify Myths Man regression sentinel
        run: |
          python - <<'PY'
          import json
          db = json.load(open('database/catalog/database_complete.json', encoding='utf-8'))
          site = json.load(open('database/catalog/catalog_site.json', encoding='utf-8'))
          audit = json.load(open('database/fragrantica/social-cards/records/social-card-ordered-image-audit.json', encoding='utf-8'))['rows']
          by_code = {str(r.get('code') or '').upper(): r for r in db}
          site_by_code = {str(r.get('code') or '').upper(): r for r in site}
          audit_by_code = {str(r.get('code') or '').upper(): r for r in audit}
          code = '1912-AMG'
          row, s, evidence = by_code.get(code), site_by_code.get(code), audit_by_code.get(code)
          if not row or not s or not evidence:
              raise SystemExit('Myths Man regression record/evidence missing')
          assert evidence.get('result') == 'EXACT_ORDERED_MATCH'
          assert str(evidence.get('fragranticaId') or '') == str(row.get('fragranticaId') or '')
          assert evidence.get('catalogNotes') == row.get('fragranticaSocialCardNotes')
          assert evidence.get('observedNotes') == row.get('fragranticaSocialCardNotes')
          print(json.dumps({'code': code, 'fid': row.get('fragranticaId'), 'status': s.get('validationStatus'), 'notes': row.get('fragranticaSocialCardNotes')}, ensure_ascii=False, indent=2))
          PY
