name: Match v2 Local Fragrantica URLs
on:
  push:
    paths:
      - '.github/match-v2-local-fragrantica-urls-trigger'
      - 'tools/promote_shobi_first_residuals_v2.py'
      - 'tools/shobi_first_additional_v2.py'
      - 'tools/run_shobi_first_promotion_v2.py'
      - '.github/workflows/match-v2-local-fragrantica-urls.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote Shobi-first reviewed mappings against local corpus
        run: python tools/run_shobi_first_promotion_v2.py
      - name: Recount remaining residuals against local corpus
        run: python tools/match_v2_against_perfume_urls.py
      - name: Commit Shobi-first promotion and recount
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database_v2_clean.json database_complete.json fragrantica-v2-shobi-first-promotion.md fragrantica-v2-local-url-match.csv fragrantica-v2-local-url-match.md
          git diff --cached --quiet && exit 0
          git commit -m 'Promote Shobi-first reviewed residual mappings'
          git pull --rebase origin main
          git push origin HEAD:main
