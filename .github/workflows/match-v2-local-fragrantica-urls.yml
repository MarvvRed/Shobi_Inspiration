name: Match v2 Local Fragrantica URLs
on:
  push:
    paths:
      - '.github/match-v2-local-fragrantica-urls-trigger'
      - 'tools/match_v2_against_perfume_urls.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match against local perfume URL corpus
        run: python tools/match_v2_against_perfume_urls.py
      - name: Commit reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fragrantica-v2-local-url-match.csv fragrantica-v2-local-url-match.md
          git diff --cached --quiet || git commit -m 'Audit v2 residuals against local Fragrantica URL corpus'
          git push
