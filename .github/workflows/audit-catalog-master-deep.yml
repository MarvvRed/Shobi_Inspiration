name: Deep Catalog Master Audit
on:
  workflow_dispatch:
  push:
    paths: ['.github/catalog-master-deep-audit-trigger']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/audit_catalog_master_deep.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-master-deep-audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Deep audit catalog against Shobi master"
          git pull --rebase origin main
          git push origin HEAD:main