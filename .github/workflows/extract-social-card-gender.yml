name: Extract Fragrantica social-card gender

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/extract_social_card_gender.py'
      - '.github/workflows/extract-social-card-gender.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pytesseract
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Extract explicit gender from archived Fragrantica social cards
        run: python tools/extract_social_card_gender.py
      - name: Verify expected audited coverage
        run: |
          python - <<'PY'
          import json
          r=json.load(open('social-card-gender-report.json',encoding='utf-8'))
          print(r)
          assert r['official']==2330, r
          # Do not publish a silently incomplete OCR run.
          assert r['withGender'] >= 2250, r
          PY
      - name: Commit gender data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add database_complete.json database_v2_clean.json social-card-gender.json social-card-gender-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Add gender from Fragrantica social cards"
            git push
          fi
