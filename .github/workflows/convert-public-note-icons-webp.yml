name: Convert public note icons to WebP

on:
  push:
    paths:
      - '.github/workflows/convert-public-note-icons-webp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Convert and verify
        run: python tools/convert_public_note_icons_to_webp.py

      - name: Commit converted library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A database/assets/note-icons database/audits/public-note-icons-webp-report.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Convert Fragrantica note icons to WebP"
            git pull --rebase origin main
            git push
          fi
