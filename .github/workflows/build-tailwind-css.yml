name: Build static Tailwind CSS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tailwind-css.yml'
      - 'tailwind.config.cjs'
      - 'tailwind.input.css'
      - 'index.html'
      - 'script.js'
      - 'site-enhancements.js'
      - 'validation-tracker.js'
      - 'fragrantica-image-link.js'

permissions:
  contents: write

concurrency:
  group: tailwind-css-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compile Tailwind CSS
        run: npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i tailwind.input.css -o tailwind.generated.css --minify
      - name: Verify generated CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('tailwind.generated.css').read_text(encoding='utf-8')
          expected = ['.hidden', '.grid', '.flex', '.bg-red-800', '.bg-emerald-800']
          missing = [selector for selector in expected if selector not in css]
          if missing or 'scale-' not in css:
              raise SystemExit(f'Missing expected selectors or arbitrary scale utility: {missing}')
          print(f'Generated CSS bytes: {len(css.encode())}')
          PY
      - name: Commit generated CSS
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tailwind.generated.css
          if git diff --cached --quiet; then
            echo 'Generated Tailwind CSS is already current.'
            exit 0
          fi
          git commit -m 'Build static Tailwind CSS for the site'
          git pull --rebase origin main
          git push
