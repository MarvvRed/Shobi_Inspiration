name: Report remaining known-FID yellows

on:
  push:
    paths:
      - 'tools/report_known_fid_remaining_yellows.py'
      - '.github/workflows/report-known-fid-remaining-yellows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/report_known_fid_remaining_yellows.py
      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/audits/known-fid-remaining-yellows.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Report remaining known-FID validation gaps"
          git push origin HEAD:main
