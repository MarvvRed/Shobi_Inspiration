name: Apply all remaining identity card proof

on:
  push:
    paths:
      - 'tools/apply_all_identity_card_proof.py'
      - '.github/workflows/apply-all-identity-card-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_all_identity_card_proof.py
      - run: python tools/build_validation_audit.py
      - run: python tools/analyze_validation_yellows.py
      - name: Commit verified identity sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database_complete.json catalog_site.json all-identity-card-proof-applied.json validation-yellow-report.json validation-yellow-report.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply strict Social Card identity proof to remaining yellows"
          git pull --rebase origin main
          git push origin HEAD:main
