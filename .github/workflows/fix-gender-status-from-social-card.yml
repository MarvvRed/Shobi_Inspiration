name: Fix gender status from Social Card

on:
  push:
    paths:
      - tools/fix_gender_status_from_social_card.py
      - .github/workflows/fix-gender-status-from-social-card.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only exact Social Card gender evidence
        run: python tools/fix_gender_status_from_social_card.py
      - name: Rebuild strict validation
        run: python tools/build_validation_audit.py
      - name: Refresh yellow report
        run: python tools/analyze_validation_yellows.py
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/catalog/database_complete.json database/catalog/catalog_site.json database/audits/gender-status-social-card-fixes.json database/audits/validation-yellow-report.json database/audits/validation-yellow-report.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Verify gender from exact Social Card evidence"
          git pull --rebase origin main
          git push
