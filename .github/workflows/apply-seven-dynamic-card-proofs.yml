name: Apply seven dynamic Social Card proofs

on:
  push:
    paths:
      - 'tools/apply_seven_dynamic_card_proofs.py'
      - '.github/workflows/apply-seven-dynamic-card-proofs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shobi-validation-writes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_seven_dynamic_card_proofs.py
      - run: python tools/build_validation_audit.py
      - run: python tools/analyze_validation_yellows.py
      - name: Commit proven Social Card recoveries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database_complete.json catalog_site.json social-card-main-notes-validated.json seven-dynamic-card-proofs-applied.json validation-yellow-report.json validation-yellow-report.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Validate seven remaining exact Social Cards"
          git pull --rebase origin main
          git push origin HEAD:main
