name: Analyze missing FID against corpus

on:
  push:
    paths:
      - 'tools/analyze_missing_fid_against_corpus.py'
      - '.github/workflows/analyze-missing-fid-corpus.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/analyze_missing_fid_against_corpus.py
      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/audits/missing-fid-corpus-analysis.json database/audits/missing-fid-corpus-analysis.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Analyze missing Fragrantica IDs against URL corpus"
          git pull --rebase origin main
          git push origin HEAD:main
