name: Audit Shobi live catalog

on:
  push:
    paths:
      - '.github/shobi-live-audit-trigger'
      - 'tools/audit_shobi_live_catalog.py'
      - '.github/workflows/audit-shobi-live-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scrape official Shobi live catalog and compare Master V2
        run: python tools/audit_shobi_live_catalog.py
      - name: Commit audit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/shobi-live-catalog-2026-09-10.csv data/shobi-live-vs-master-v2-2026-09-10.md
          git diff --cached --quiet || git commit -m 'Audit live Shobi catalog against Master V2'
          git pull --rebase origin main
          git push origin main
