name: Fix official database status
on:
  push:
    paths:
      - 'tools/fix_official_database_status.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fix_official_database_status.py
      - run: python tools/count_official_site_catalog.py
      - name: Commit corrected database and audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add database_complete.json site-official-count.md
          git diff --cached --quiet || git commit -m "Align official database verification status"
          git push
