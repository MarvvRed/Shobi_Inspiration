name: Analyze per-label OCR pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/analyze_label_ocr_pilot.py'
      - '.github/workflows/analyze-label-ocr-pilot.yml'

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Install dependencies
        run: |
          command -v tesseract || (sudo apt-get update && sudo apt-get install -y tesseract-ocr)
          python -m pip install --disable-pip-version-check pillow
      - name: Run non-destructive per-label OCR pilot
        env:
          LABEL_OCR_PILOT_LIMIT: '0'
        run: python tools/analyze_label_ocr_pilot.py
      - name: Commit pilot analysis only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/audits/label-ocr-pilot.json
          if git diff --cached --quiet; then
            echo 'No pilot output to publish.'
            exit 0
          fi
          git commit -m 'Publish full V2 per-label OCR analysis'
          git pull --rebase origin main
          git push origin main
