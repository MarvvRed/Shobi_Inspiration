name: Analyze remaining FID mismatch yellows

on:
  push:
    paths:
      - 'tools/analyze_fid_mismatch_yellows.py'
      - '.github/workflows/analyze-fid-mismatch-yellows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/analyze_fid_mismatch_yellows.py
      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fid-mismatch-yellows.json fid-mismatch-yellows.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Analyze remaining validated-card FID mismatches"
          git pull --rebase origin main
          git push origin HEAD:main
