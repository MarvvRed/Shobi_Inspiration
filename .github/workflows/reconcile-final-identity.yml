name: Reconcile final Fragrantica identity status
on:
  push:
    paths:
      - 'tools/reconcile_final_identity_audit.py'
      - '.github/reconcile-final-identity-trigger'
      - 'database_v2_clean.json'
  workflow_dispatch:
jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/reconcile_final_identity_audit.py
      - name: Commit status
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fragrantica-final-identity-status.csv fragrantica-final-identity-summary.txt
          git diff --cached --quiet || git commit -m "Reconcile final Fragrantica identity status"
          git push
