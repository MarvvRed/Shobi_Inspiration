name: Extract Fragrantica Gender and Season

on:
  workflow_dispatch:
    inputs:
      calibrate:
        description: 'Generate calibration crops and a 24-card calibration dataset'
        required: false
        default: 'true'
  push:
    paths:
      - '.github/fragrantica-gender-season-trigger'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          pip install pillow pytesseract
      - name: Extract gender and season
        run: |
          MODE="calibrate"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.calibrate }}" = "false" ]; then MODE="full"; fi
          elif grep -q '^mode=full$' .github/fragrantica-gender-season-trigger 2>/dev/null; then
            MODE="full"
          fi

          if [ "$MODE" = "calibrate" ]; then
            python fragrantica-scraper-archive/social-cards/extract_gender_season.py --calibrate
            python fragrantica-scraper-archive/social-cards/extract_gender_season.py --limit 24
          else
            python fragrantica-scraper-archive/social-cards/extract_gender_season.py
          fi
      - name: Commit extraction output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f fragrantica-scraper-archive/social-cards/calibration-crops 2>/dev/null || true
          git add fragrantica-scraper-archive/social-cards/gender-season.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No extraction changes"
            exit 0
          fi
          git commit -m "Extract Fragrantica social card gender and season data"
          git pull --rebase origin main
          git push origin HEAD:main
