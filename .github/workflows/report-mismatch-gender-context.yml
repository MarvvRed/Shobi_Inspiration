name: Report FID mismatch gender context

on:
  push:
    paths:
      - 'tools/report_mismatch_gender_context.py'
      - '.github/workflows/report-mismatch-gender-context.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/report_mismatch_gender_context.py
      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/audits/fid-mismatch-gender-context.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Report gender context for FID mismatches"
          git pull --rebase origin main
          git push origin HEAD:main
