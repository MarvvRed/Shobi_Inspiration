name: Validate current-yellow V2 exact candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/validate_current_yellow_v2_exact_candidates.py'
      - '.github/workflows/validate-current-yellow-v2-exact.yml'
      - 'database/audits/current-yellow-label-ocr-v2.json'
      - 'database/catalog/database_complete.json'
      - 'database/catalog/catalog_site.json'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Validate strong exact current-yellow candidates
        run: python tools/validate_current_yellow_v2_exact_candidates.py
      - name: Commit validation report only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/audits/current-yellow-v2-exact-validation.json
          if git diff --cached --quiet; then
            echo 'No current-yellow validation changes.'
            exit 0
          fi
          git commit -m 'Publish current-yellow V2 strong validation'
          git pull --rebase origin main
          git push origin main
