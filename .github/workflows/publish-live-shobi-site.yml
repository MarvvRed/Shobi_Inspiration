name: Publish live Shobi catalog to site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-live-shobi-site.yml'
      - 'tools/build_live_site_from_shobi_csv.py'
      - 'tools/build_validation_audit.py'
      - 'tools/build_final_perfume_catalog.py'
      - 'tools/verify_catalog_invariants.py'
      - 'tools/audit_social_card_order_from_images.py'
      - 'tools/recover_exact_card_proofs_multipass.py'
      - 'tools/recover_header_anchored_six_slot_proofs.py'
      - 'tools/preserve_strict_ordered_social_card_proofs.py'
      - 'tools/apply_exact_card_proofs_multipass.py'
      - 'tools/verify_current_yellow_slot_ocr_v4_independent.py'
      - 'tools/apply_current_yellow_slot_ocr_v4_independent.py'
      - 'tools/analyze_current_yellow_neural_ocr_v6.py'
      - 'tools/verify_current_yellow_neural_ocr_v6_independent.py'
      - 'tools/apply_current_yellow_neural_ocr_v6_independent.py'
      - 'database/catalog/**'
      - 'database/source/**'
      - 'database/fragrantica/social-cards/records/**'
      - 'database/assets/note-icons/**'
      - 'database/audits/display-identity-hygiene-audit.json'
      - 'database/audits/identity-change-allowlist.json'
      - 'database/audits/critical-identity-fixes.json'
      - 'database/audits/critical-identity-regression-registry.json'
      - 'database/audits/shared-fid-alias-registry.json'

permissions:
  contents: write

concurrency:
  group: shobi-catalog-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-catalog:
    runs-on: ubuntu-latest
    # A complete fresh card audit plus conservative recovery can exceed one
    # hour on the hosted two-worker runner.  The lower limit canceled valid
    # runs during the last recovery gate, before any catalog write.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Recover malformed generated metadata
        run: |
          if python -m json.tool database/catalog/database_complete.json >/dev/null 2>&1 && python -m json.tool database/fragrantica/social-cards/records/social-card-main-notes-validated.json >/dev/null 2>&1; then
            echo 'Generated metadata is valid.'
            exit 0
          fi
          echo 'Recovering the last valid generated metadata from history.'
          for commit in $(git rev-list HEAD^); do
            if git show "$commit:database/catalog/database_complete.json" 2>/dev/null | python -m json.tool >/dev/null 2>&1 && \
               git show "$commit:database/fragrantica/social-cards/records/social-card-main-notes-validated.json" 2>/dev/null | python -m json.tool >/dev/null 2>&1; then
              git show "$commit:database/catalog/database_complete.json" > database/catalog/database_complete.json
              git show "$commit:database/fragrantica/social-cards/records/social-card-main-notes-validated.json" > database/fragrantica/social-cards/records/social-card-main-notes-validated.json
              echo "Recovered metadata from $commit."
              exit 0
            fi
            if git show "$commit:database_complete.json" 2>/dev/null | python -m json.tool >/dev/null 2>&1 && \
               git show "$commit:social-card-main-notes-validated.json" 2>/dev/null | python -m json.tool >/dev/null 2>&1; then
              git show "$commit:database_complete.json" > database/catalog/database_complete.json
              git show "$commit:social-card-main-notes-validated.json" > database/fragrantica/social-cards/records/social-card-main-notes-validated.json
              echo "Recovered legacy metadata from $commit."
              exit 0
            fi
          done
          echo 'No valid historical metadata was found.' >&2
          exit 1

      - name: Build website database from live CSV
        run: python tools/build_live_site_from_shobi_csv.py

      - name: Rebuild strict ordered Social Card audit
        run: |
          command -v tesseract || (sudo apt-get update && sudo apt-get install -y tesseract-ocr)
          python -m pip install --disable-pip-version-check pillow numpy
          cp database/fragrantica/social-cards/records/social-card-ordered-image-audit.json database/fragrantica/social-cards/records/social-card-ordered-image-audit.pre-rebuild.json
          set +e
          SOCIAL_CARD_AUDIT_WORKERS=2 SOCIAL_CARD_AUDIT_BATCH=100 python tools/audit_social_card_order_from_images.py > social-card-audit-ci.log 2>&1
          audit_status=$?
          if [ "$audit_status" -ne 0 ]; then
            tail -n 160 social-card-audit-ci.log > social-card-audit-ci-error.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add social-card-audit-ci-error.log
            git commit -m 'Capture Social Card audit failure details'
            git push
            exit "$audit_status"
          fi
          rm social-card-audit-ci.log
          python tools/apply_strict_ordered_card_audit.py
          python tools/refresh_strict_ordered_mismatches.py
          SOCIAL_CARD_RECOVERY_WORKERS=2 python tools/recover_exact_card_proofs_multipass.py
          python tools/apply_exact_card_proofs_multipass.py
          python tools/recover_header_anchored_six_slot_proofs.py
          python tools/preserve_strict_ordered_social_card_proofs.py
          # V4's report is only a work list.  The next two steps independently
          # re-read the live current card and fail closed before changing audit state.
          python tools/verify_current_yellow_slot_ocr_v4_independent.py
          python tools/apply_current_yellow_slot_ocr_v4_independent.py
          # The V6 neural report only selects candidates. Re-run the different
          # layout-aware Tesseract verifier against this freshly rebuilt audit
          # before its writer can promote any row.
          python tools/verify_current_yellow_neural_ocr_v6_independent.py
          python tools/apply_current_yellow_neural_ocr_v6_independent.py
          rm database/fragrantica/social-cards/records/social-card-ordered-image-audit.pre-rebuild.json

      - name: Build strict validation audit
        run: python tools/build_validation_audit.py

      - name: Build certified perfume-only public catalog
        run: python tools/build_final_perfume_catalog.py

      - name: Independent green/FID/identity safety gate
        run: python tools/verify_catalog_invariants.py --baseline-ref HEAD --write-report

      - name: Validate website catalog
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = json.load(open('database/catalog/database_complete.json', encoding='utf-8'))
          site_rows = json.load(open('database/catalog/catalog_site.json', encoding='utf-8'))
          final_rows = json.load(open('database/catalog/catalog_final_perfume_only.json', encoding='utf-8'))
          final_db_rows = json.load(open('database/catalog/database_final_perfume_only.json', encoding='utf-8'))
          certification = json.load(open('database/catalog/final-perfume-catalog-certification.json', encoding='utf-8'))
          exclusions = json.load(open('database/catalog/catalog-scope-exclusions.json', encoding='utf-8'))['codes']
          identity_hygiene = json.load(open('database/audits/display-identity-hygiene-audit.json', encoding='utf-8'))

          expected = int(certification['finalRows'])
          direct = int(certification['directFragranticaIdentityProofRows'])
          exceptions = certification.get('exceptionRowsWithSpecificEvidence', [])
          excluded_codes = set(exclusions)

          assert expected == direct + len(exceptions)
          assert len(rows) == expected
          assert len(site_rows) == expected
          assert len(final_rows) == expected
          assert len(final_db_rows) == expected
          assert len({r['code'] for r in rows}) == expected
          assert len({r['prestashopProductId'] for r in rows}) == expected
          assert len({r['shobiUrl'] for r in rows}) == expected
          assert not any(str(r.get('reference', '')).upper().startswith('MIX') for r in rows)
          assert all(r.get('code') and r.get('brand') and r.get('inspiredBy') for r in rows)
          assert all(r.get('code') and r.get('brand') and r.get('inspiredBy') for r in site_rows)
          assert [(r['code'], r['brand'], r['inspiredBy']) for r in site_rows] == [(r['code'], r['brand'], r['inspiredBy']) for r in rows]
          assert os.path.getsize('database/catalog/catalog_site.json') < os.path.getsize('database/catalog/database_complete.json')
          assert "fetch('database/catalog/catalog_final_perfume_only.json'" in Path('script.js').read_text(encoding='utf-8')
          assert not any(r['code'] in excluded_codes for r in final_rows)
          assert not any(r['code'] in excluded_codes for r in rows)
          assert not any(r['code'] in excluded_codes for r in site_rows)
          assert len({r['code'] for r in final_rows}) == len(final_rows)
          assert len({r['code'] for r in final_db_rows}) == len(final_db_rows)
          assert len({r['prestashopProductId'] for r in final_db_rows}) == len(final_db_rows)
          assert '<script src="validation-tracker.js"></script>' in Path('index.html').read_text(encoding='utf-8')
          # The browser loads the final catalog. catalog_site.json is the
          # intentionally lean input used to build it and has no QA fields.
          assert all(r.get('validationStatus') in {'green','yellow','red'} for r in final_rows)
          assert all('validationChecks' in r and 'validationIssues' in r for r in final_rows)
          assert all(all(r['validationChecks'].values()) for r in final_rows if r['validationStatus'] == 'green')
          excluded_categories = {'Home Fragrances', 'Gifts', 'Lattafa', 'Paris Corner', 'Al Haramain Oriental Perfumes'}
          assert not any(r.get('shobiCategory') in excluded_categories for r in rows)

          suspicious_public = [
              item for item in identity_hygiene.get('rows', [])
              if str(item.get('code') or '').strip().upper() not in excluded_codes
          ]
          assert not suspicious_public, f'Public display identity hygiene regressions: {suspicious_public}'

          counts = {s: sum(r['validationStatus'] == s for r in final_rows) for s in ('green','yellow','red')}
          print(f'Validated {expected} unique certified wearable Shobi perfumes in the public catalog')
          print('QA tracker:', counts)
          print('Public display identity hygiene: clean')
          PY

      - name: Commit website database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/catalog/database_complete.json database/catalog/catalog_site.json database/catalog/catalog_final_perfume_only.json database/catalog/database_final_perfume_only.json database/catalog/final-perfume-catalog-certification.json database/audits/FINAL-PERFUME-CATALOG.md database/audits/CURRENT-CATALOG-AUDIT.md database/audits/current-yellow-breakdown.json database/audits/current-yellow-slot-ocr-v4-independent-verification.json database/audits/current-yellow-neural-ocr-v6-independent-verification.json database/catalog/catalog-scope-exclusions.json database/catalog/catalog-wearable-original-scope-audit.json database/fragrantica/social-cards/records/social-card-main-notes-validated.json database/fragrantica/social-cards/records/social-card-ordered-image-audit.json database/audits/strict-ordered-card-corrections.json script.js index.html tools/build_final_perfume_catalog.py
          if git diff --cached --quiet; then
            echo 'No website catalog changes.'
            exit 0
          fi
          git commit -m 'Publish Shobi validation tracker'
          # A report-only Action can finish while this long audit runs. Rebase
          # the generated commit on that newer main rather than discarding a
          # fully verified publication because of an ordinary push race.
          git pull --rebase origin main
          git push
