name: Publish live Shobi catalog to site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-live-shobi-site.yml'
      - 'tools/build_live_site_from_shobi_csv.py'
      - 'tools/build_validation_audit.py'
      - 'validation-tracker.js'
      - 'shobi-perfumes-live-unique.csv'
      - 'data/shobi-fragrantica-mapping.csv'
      - 'data/shobi-identity-review-2026-09-04.csv'

permissions:
  contents: write

jobs:
  publish-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Recover malformed generated metadata
        run: |
          if python -m json.tool database_complete.json >/dev/null 2>&1 && python -m json.tool social-card-main-notes-validated.json >/dev/null 2>&1; then
            echo 'Generated metadata is valid.'
            exit 0
          fi
          echo 'Recovering the last valid generated metadata from the parent commit.'
          git show HEAD^:database_complete.json > database_complete.json
          git show HEAD^:social-card-main-notes-validated.json > social-card-main-notes-validated.json

      - name: Build website database from live CSV
        run: python tools/build_live_site_from_shobi_csv.py

      - name: Rebuild strict ordered Social Card audit
        run: |
          command -v tesseract || (sudo apt-get update && sudo apt-get install -y tesseract-ocr)
          python -m pip install --disable-pip-version-check pillow
          python tools/audit_social_card_order_from_images.py
          python tools/apply_strict_ordered_card_audit.py
          python tools/refresh_strict_ordered_mismatches.py

      - name: Build strict validation audit
        run: python tools/build_validation_audit.py

      - name: Point frontend at lightweight catalog and install tracker
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('script.js')
          text = path.read_text(encoding='utf-8')
          old = "fetch('database_complete.json')"
          new = "fetch('catalog_site.json')"
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Could not find frontend catalog fetch')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          tracker = '<script src="validation-tracker.js"></script>'
          if tracker not in html:
              marker = '<script src="perfume-images/map.js"></script>'
              if marker not in html:
                  raise SystemExit('Could not find tracker insertion point')
              html = html.replace(marker, marker + '\n' + tracker, 1)
              index.write_text(html, encoding='utf-8')
          PY

      - name: Validate website catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.load(open('database_complete.json', encoding='utf-8'))
          site_rows = json.load(open('catalog_site.json', encoding='utf-8'))
          assert len(rows) == 2324
          assert len(site_rows) == 2324
          assert len({r['prestashopProductId'] for r in rows}) == 2324
          assert len({r['shobiUrl'] for r in rows}) == 2324
          assert not any(str(r.get('reference', '')).upper().startswith('MIX') for r in rows)
          assert all(r.get('code') and r.get('brand') and r.get('inspiredBy') for r in rows)
          assert all(r.get('code') and r.get('brand') and r.get('inspiredBy') for r in site_rows)
          assert [(r['code'], r['brand'], r['inspiredBy']) for r in site_rows] == [(r['code'], r['brand'], r['inspiredBy']) for r in rows]
          assert __import__('os').path.getsize('catalog_site.json') < __import__('os').path.getsize('database_complete.json')
          assert "fetch('catalog_site.json')" in Path('script.js').read_text(encoding='utf-8')
          assert '<script src="validation-tracker.js"></script>' in Path('index.html').read_text(encoding='utf-8')
          assert all(r.get('validationStatus') in {'green','yellow','red'} for r in site_rows)
          assert all('validationChecks' in r and 'validationIssues' in r for r in site_rows)
          assert all(all(r['validationChecks'].values()) for r in site_rows if r['validationStatus'] == 'green')
          excluded = {'Home Fragrances', 'Gifts', 'Lattafa', 'Paris Corner', 'Al Haramain Oriental Perfumes'}
          assert not any(r.get('shobiCategory') in excluded for r in rows)
          counts = {s: sum(r['validationStatus'] == s for r in site_rows) for s in ('green','yellow','red')}
          print('Validated 2324 non-MIX live Shobi perfumes and lightweight frontend catalog')
          print('QA tracker:', counts)
          PY

      - name: Commit website database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database_complete.json catalog_site.json social-card-main-notes-validated.json social-card-ordered-image-audit.json strict-ordered-card-corrections.json script.js index.html
          if git diff --cached --quiet; then
            echo 'No website catalog changes.'
            exit 0
          fi
          git commit -m 'Publish Shobi validation tracker'
          git push
