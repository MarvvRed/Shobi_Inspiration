name: Publish live Shobi catalog to site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-live-shobi-site.yml'
      - 'tools/build_live_site_from_shobi_csv.py'
      - 'tools/build_validation_audit.py'
      - 'tools/build_final_perfume_catalog.py'
      - 'database/catalog/**'
      - 'database/source/**'
      - 'database/fragrantica/social-cards/records/**'

permissions:
  contents: write

jobs:
  publish-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Recover malformed generated metadata
        run: |
          if python -m json.tool database/catalog/database_complete.json >/dev/null 2>&1 && python -m json.tool database/fragrantica/social-cards/records/social-card-main-notes-validated.json >/dev/null 2>&1; then
            echo 'Generated metadata is valid.'
            exit 0
          fi
          echo 'Recovering the last valid generated metadata from history.'
          for commit in $(git rev-list HEAD^); do
            if git show "$commit:database/catalog/database_complete.json" 2>/dev/null | python -m json.tool >/dev/null 2>&1 && \
               git show "$commit:database/fragrantica/social-cards/records/social-card-main-notes-validated.json" 2>/dev/null | python -m json.tool >/dev/null 2>&1; then
              git show "$commit:database/catalog/database_complete.json" > database/catalog/database_complete.json
              git show "$commit:database/fragrantica/social-cards/records/social-card-main-notes-validated.json" > database/fragrantica/social-cards/records/social-card-main-notes-validated.json
              echo "Recovered metadata from $commit."
              exit 0
            fi
            if git show "$commit:database_complete.json" 2>/dev/null | python -m json.tool >/dev/null 2>&1 && \
               git show "$commit:social-card-main-notes-validated.json" 2>/dev/null | python -m json.tool >/dev/null 2>&1; then
              git show "$commit:database_complete.json" > database/catalog/database_complete.json
              git show "$commit:social-card-main-notes-validated.json" > database/fragrantica/social-cards/records/social-card-main-notes-validated.json
              echo "Recovered legacy metadata from $commit."
              exit 0
            fi
          done
          echo 'No valid historical metadata was found.' >&2
          exit 1

      - name: Build website database from live CSV
        run: python tools/build_live_site_from_shobi_csv.py

      - name: Rebuild strict ordered Social Card audit
        run: |
          command -v tesseract || (sudo apt-get update && sudo apt-get install -y tesseract-ocr)
          python -m pip install --disable-pip-version-check pillow numpy
          set +e
          SOCIAL_CARD_AUDIT_WORKERS=2 SOCIAL_CARD_AUDIT_BATCH=100 python tools/audit_social_card_order_from_images.py > social-card-audit-ci.log 2>&1
          audit_status=$?
          if [ "$audit_status" -ne 0 ]; then
            tail -n 160 social-card-audit-ci.log > social-card-audit-ci-error.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add social-card-audit-ci-error.log
            git commit -m 'Capture Social Card audit failure details'
            git push
            exit "$audit_status"
          fi
          rm social-card-audit-ci.log
          python tools/apply_strict_ordered_card_audit.py
          python tools/refresh_strict_ordered_mismatches.py

      - name: Build strict validation audit
        run: python tools/build_validation_audit.py

      - name: Build certified perfume-only public catalog
        run: python tools/build_final_perfume_catalog.py

      - name: Validate website catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.load(open('database/catalog/database_complete.json', encoding='utf-8'))
          site_rows = json.load(open('database/catalog/catalog_site.json', encoding='utf-8'))
          final_rows = json.load(open('database/catalog/catalog_final_perfume_only.json', encoding='utf-8'))
          final_db_rows = json.load(open('database/catalog/database_final_perfume_only.json', encoding='utf-8'))
          exclusions = json.load(open('database/catalog/catalog-scope-exclusions.json', encoding='utf-8'))['codes']
          assert len(rows) == 2253
          assert len(site_rows) == 2253
          assert len(final_rows) == 2253
          assert len(final_db_rows) == 2253
          assert len({r['code'] for r in rows}) == 2253
          assert len({r['prestashopProductId'] for r in rows}) == 2253
          assert len({r['shobiUrl'] for r in rows}) == 2253
          assert not any(str(r.get('reference', '')).upper().startswith('MIX') for r in rows)
          assert all(r.get('code') and r.get('brand') and r.get('inspiredBy') for r in rows)
          assert all(r.get('code') and r.get('brand') and r.get('inspiredBy') for r in site_rows)
          assert [(r['code'], r['brand'], r['inspiredBy']) for r in site_rows] == [(r['code'], r['brand'], r['inspiredBy']) for r in rows]
          assert __import__('os').path.getsize('database/catalog/catalog_site.json') < __import__('os').path.getsize('database/catalog/database_complete.json')
          assert "fetch('database/catalog/catalog_final_perfume_only.json'" in Path('script.js').read_text(encoding='utf-8')
          assert not any(r['code'] in exclusions for r in final_rows)
          assert not any(r['code'] in exclusions for r in rows)
          assert not any(r['code'] in exclusions for r in site_rows)
          assert len({r['code'] for r in final_rows}) == len(final_rows)
          assert len({r['code'] for r in final_db_rows}) == len(final_db_rows)
          assert len({r['prestashopProductId'] for r in final_db_rows}) == len(final_db_rows)
          assert '<script src="validation-tracker.js"></script>' in Path('index.html').read_text(encoding='utf-8')
          assert all(r.get('validationStatus') in {'green','yellow','red'} for r in site_rows)
          assert all('validationChecks' in r and 'validationIssues' in r for r in site_rows)
          assert all(all(r['validationChecks'].values()) for r in site_rows if r['validationStatus'] == 'green')
          excluded = {'Home Fragrances', 'Gifts', 'Lattafa', 'Paris Corner', 'Al Haramain Oriental Perfumes'}
          assert not any(r.get('shobiCategory') in excluded for r in rows)
          counts = {s: sum(r['validationStatus'] == s for r in site_rows) for s in ('green','yellow','red')}
          print('Validated 2253 unique certified wearable Shobi perfumes in the public catalog')
          print('QA tracker:', counts)
          PY

      - name: Commit website database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/catalog/database_complete.json database/catalog/catalog_site.json database/catalog/catalog_final_perfume_only.json database/catalog/database_final_perfume_only.json database/catalog/final-perfume-catalog-certification.json database/audits/FINAL-PERFUME-CATALOG.md database/catalog/catalog-scope-exclusions.json database/catalog/catalog-wearable-original-scope-audit.json database/fragrantica/social-cards/records/social-card-main-notes-validated.json database/fragrantica/social-cards/records/social-card-ordered-image-audit.json database/audits/strict-ordered-card-corrections.json script.js index.html tools/build_final_perfume_catalog.py
          if git diff --cached --quiet; then
            echo 'No website catalog changes.'
            exit 0
          fi
          git commit -m 'Publish Shobi validation tracker'
          git push
