name: Apply web-verified identity-only fixes

on:
  push:
    paths:
      - tools/apply_web_verified_identity_only.py
      - .github/workflows/apply-web-verified-identity-only.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact direct-page verification
        run: python tools/apply_web_verified_identity_only.py
      - name: Rebuild strict validation
        run: python tools/build_validation_audit.py
      - name: Refresh yellow report
        run: python tools/analyze_validation_yellows.py
      - name: Commit verified identities
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database_complete.json catalog_site.json web-verified-identity-only-fixes.json validation-yellow-report.json validation-yellow-report.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Verify remaining identity-only rows from direct Fragrantica pages"
          git pull --rebase origin main
          git push
