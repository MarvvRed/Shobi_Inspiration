name: Recover identity source from git history

on:
  push:
    paths:
      - tools/recover_identity_source_from_git_history.py
      - .github/workflows/recover-identity-source-from-git-history.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore only exact historical provenance
        run: python tools/recover_identity_source_from_git_history.py
      - name: Rebuild strict validation
        run: python tools/build_validation_audit.py
      - name: Refresh yellow report
        run: python tools/analyze_validation_yellows.py
      - name: Commit recovered provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database_complete.json catalog_site.json identity-source-history-recovery.json validation-yellow-report.json validation-yellow-report.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore exact identity provenance from git history"
          git pull --rebase origin main
          git push
