name: Analyze remaining validation recoverability

on:
  push:
    paths:
      - '.github/workflows/analyze-validation-recoverability-now.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze remaining recoverability
        run: python tools/analyze_validation_recoverability.py
      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/audits/validation-recoverability-report.json database/audits/validation-recoverability-report.md
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "Refresh remaining yellow recoverability report"
          git pull --rebase origin main
          git push origin HEAD:main
