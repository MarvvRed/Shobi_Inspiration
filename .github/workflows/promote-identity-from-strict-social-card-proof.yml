name: Promote identity from strict Social Card proof

on:
  push:
    paths:
      - tools/promote_identity_from_strict_social_card_proof.py
      - .github/workflows/promote-identity-from-strict-social-card-proof.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply strict exact-card identity provenance
        run: python tools/promote_identity_from_strict_social_card_proof.py
      - name: Rebuild strict validation
        run: python tools/build_validation_audit.py
      - name: Refresh yellow report
        run: python tools/analyze_validation_yellows.py
      - name: Commit verified promotions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/catalog/database_complete.json database/catalog/catalog_site.json database/audits/strict-social-card-identity-promotions.json database/audits/validation-yellow-report.json database/audits/validation-yellow-report.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Verify identity from exact Social Card text"
          git pull --rebase origin main
          git push
