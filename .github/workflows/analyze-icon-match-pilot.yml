name: Analyze Social Card icon matching pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/analyze_icon_match_pilot.py'
      - '.github/workflows/analyze-icon-match-pilot.yml'

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Install dependencies
        run: |
          command -v tesseract || (sudo apt-get update && sudo apt-get install -y tesseract-ocr)
          python -m pip install --disable-pip-version-check pillow numpy
      - name: Run non-destructive icon matching pilot
        env:
          ICON_PILOT_LIMIT: '120'
        run: python tools/analyze_icon_match_pilot.py
      - name: Commit pilot analysis only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/audits/icon-match-pilot.json
          if git diff --cached --quiet; then
            echo 'No pilot output to publish.'
            exit 0
          fi
          git commit -m 'Publish icon matching pilot analysis'
          git pull --rebase origin main
          git push origin main
