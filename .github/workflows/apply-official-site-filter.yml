name: Apply official site catalog filter
on:
  push:
    paths:
      - 'tools/apply_official_site_filter.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_official_site_filter.py
      - name: Commit site update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add script.js
          git diff --cached --quiet || git commit -m "Show only official resolved perfumes on site"
          git push
