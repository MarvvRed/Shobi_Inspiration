name: Fix 2194-ORT to Cuoium Orto Parisi

on:
  push:
    paths:
      - 'tools/fix_2194_ort_to_cuoium.py'
      - '.github/workflows/fix-2194-ort-cuoium.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shobi-validation-writes
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fix_2194_ort_to_cuoium.py
      - name: Recover exact-card gender and season after identity fix
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m pip install pillow pytesseract
          python tools/recover_gender_season_all_exact_cards.py
      - run: python tools/build_validation_audit.py
      - run: python tools/analyze_validation_yellows.py
      - name: Commit corrected identity chain
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Correct 2194-ORT to Cuoium Orto Parisi"
          git pull --rebase origin main
          git push origin HEAD:main
