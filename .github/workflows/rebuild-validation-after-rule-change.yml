name: Rebuild validation after rule change

on:
  push:
    paths:
      - tools/build_validation_audit.py
      - .github/workflows/rebuild-validation-after-rule-change.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild strict validation
        run: python tools/build_validation_audit.py
      - name: Refresh yellow reports
        run: |
          python tools/analyze_validation_yellows.py
          python tools/analyze_social_card_note_yellows.py
      - name: Commit rebuilt validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/catalog/database_complete.json database/catalog/catalog_site.json database/audits/validation-yellow-report.json database/audits/validation-yellow-report.md database/fragrantica/social-cards/records/social-card-note-yellow-analysis.json database/audits/social-card-note-yellow-analysis.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild validation with metadata-based Social Card proof"
          git pull --rebase origin main
          git push
