name: Refetch final four Social Cards

on:
  push:
    paths:
      - 'tools/refetch_final_four_social_cards.py'
      - '.github/workflows/refetch-final-four-social-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python tools/refetch_final_four_social_cards.py
      - name: Commit report and recovered cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/audits/final-four-card-refetch.json database/fragrantica/social-cards/images/refetched_*.jpeg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refetch final four exact Social Cards"
          git pull --rebase origin main
          git push origin HEAD:main
