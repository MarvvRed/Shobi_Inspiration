name: Apply exact current-card note proofs

on:
  push:
    paths:
      - 'tools/apply_existing_notes_current_card_fast_proof.py'
      - '.github/workflows/apply-existing-notes-current-card-fast-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shobi-validation-writes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove exact notes from archived Social Cards
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --disable-pip-version-check pillow pytesseract
          python tools/validate_existing_notes_on_current_cards_fast.py
      - name: Apply unique exact current-card proofs
        run: python tools/apply_existing_notes_current_card_fast_proof.py
      - name: Rebuild strict validation
        run: python tools/build_validation_audit.py
      - name: Refresh yellow report
        run: python tools/analyze_validation_yellows.py
      - name: Commit proven rows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Validate archived exact Social Card proofs"
          git push origin HEAD:main
