name: Fetch Fragrantica Social Cards

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/fragrantica-social-cards-trigger"

permissions:
  contents: write

concurrency:
  group: fragrantica-social-cards
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch social cards
        env:
          SOCIAL_CARD_DELAY: "0.15"
        run: python fragrantica-scraper-archive/social-cards/fetch_social_cards.py

      - name: Commit social card archive
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fragrantica-scraper-archive/social-cards/manifest.csv || true
          git add fragrantica-scraper-archive/social-cards/images || true

          if git diff --cached --quiet; then
            echo "No new social cards to commit."
            exit 0
          fi

          git commit -m "Archive Fragrantica social cards"
          git push
