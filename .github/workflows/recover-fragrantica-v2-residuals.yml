name: Recover Fragrantica v2 Residuals
on:
  push:
    paths:
      - '.github/recover-fragrantica-v2-residuals-trigger'
      - 'tools/recover_fragrantica_v2_residuals.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover residual candidates
        run: python tools/recover_fragrantica_v2_residuals.py
      - name: Commit reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fragrantica-v2-residual-recovery.csv fragrantica-v2-residual-recovery.md
          git diff --cached --quiet || git commit -m 'Audit Fragrantica v2 residual recovery'
          git pull --rebase origin main
          git push origin main
