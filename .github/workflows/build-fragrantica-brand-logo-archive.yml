name: Build Fragrantica Brand Logo Archive

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum directory pages (0 = all discovered pages)"
        required: false
        default: "0"
      limit:
        description: "Maximum brands (0 = all discovered brands)"
        required: false
        default: "0"
      retry_failed:
        description: "Retry failed image downloads"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fragrantica-brand-logo-archive
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 pillow
      - name: Collect directory images
        run: |
          ARGS=""
          if [ "\${{ inputs.max_pages }}" != "0" ]; then ARGS="$ARGS --max-pages \${{ inputs.max_pages }}"; fi
          if [ "\${{ inputs.limit }}" != "0" ]; then ARGS="$ARGS --limit \${{ inputs.limit }}"; fi
          if [ "\${{ inputs.retry_failed }}" = "true" ]; then ARGS="$ARGS --retry-failed"; fi
          python tools/build_fragrantica_brand_logos.py $ARGS
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/brands/brands_logos.json database/assets/brand-logos
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "Build Fragrantica brand logo archive"
            git push
          fi
