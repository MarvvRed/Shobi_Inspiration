name: Build Fragrantica Brand Logo Archive

on:
  push:
    branches: [main]
    paths:
      - "tools/build_fragrantica_brand_logos.py"
      - ".github/workflows/build-fragrantica-brand-logo-archive.yml"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum directory pages (0 = all discovered pages)"
        required: false
        default: "0"
      limit:
        description: "Maximum brands (0 = all discovered brands)"
        required: false
        default: "0"
      retry_failed:
        description: "Retry failed image downloads"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fragrantica-brand-logo-archive
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 pillow
      - name: Collect directory images
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
          BRAND_LIMIT: ${{ inputs.limit }}
          RETRY_FAILED: ${{ inputs.retry_failed }}
        run: |
          ARGS=""
          if [ "$MAX_PAGES" != "0" ]; then ARGS="$ARGS --max-pages $MAX_PAGES"; fi
          if [ "$BRAND_LIMIT" != "0" ]; then ARGS="$ARGS --limit $BRAND_LIMIT"; fi
          if [ "$RETRY_FAILED" = "true" ]; then ARGS="$ARGS --retry-failed"; fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            ARGS="$ARGS --max-pages 1 --limit 30 --delay 4 --retry-failed"
          fi
          python tools/build_fragrantica_brand_logos.py $ARGS
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/brands/brands_logos.json database/assets/brand-logos
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "Build Fragrantica brand logo archive"
            git push
          fi
