name: Audit public note icons

on:
  push:
    paths:
      - 'tools/audit_public_note_icons.py'
      - '.github/workflows/audit-public-note-icons.yml'
      - 'database/assets/note-icons/**'
      - 'database/assets/note-icons/map.js'
      - 'database/catalog/database_complete.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shobi-validation-writes
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python tools/audit_public_note_icons.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/audits/public-note-icons-audit.json database/audits/public-note-icons-audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit Fragrantica note icon library"
          git pull --rebase origin main
          git push origin HEAD:main
