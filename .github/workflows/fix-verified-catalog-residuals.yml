name: Fix Verified Catalog Residuals
on:
  push:
    paths:
      - '.github/fix-verified-residuals-trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fix_verified_catalog_residuals.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database_complete.json
          git diff --cached --quiet || git commit -m "Fix verified catalog residuals"
          git pull --rebase origin main
          git push origin main
