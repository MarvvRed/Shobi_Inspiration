name: Audit Catalog Master Coverage
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/catalog-master-coverage-trigger'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare operational database with Shobi master
        run: python tools/audit_catalog_master_coverage.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-master-coverage-audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit operational catalog against Shobi master"
          git pull --rebase origin main
          git push origin HEAD:main
