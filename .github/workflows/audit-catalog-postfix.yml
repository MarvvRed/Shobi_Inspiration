name: Post-fix Catalog Audit
on:
  push:
    paths:
      - '.github/catalog-postfix-audit-trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/audit_catalog_postfix.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-postfix-audit.md
          git diff --cached --quiet || git commit -m "Update post-fix catalog audit"
          git pull --rebase origin main
          git push origin main