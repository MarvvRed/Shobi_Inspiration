name: Analyze shared-FID Social Card recovery

on:
  push:
    paths:
      - tools/analyze_shared_fid_social_card_recovery.py
      - .github/workflows/analyze-shared-fid-social-card-recovery.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/analyze_shared_fid_social_card_recovery.py
      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/audits/shared-fid-social-card-recovery.json database/audits/shared-fid-social-card-recovery.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish exact-FID Social Card recovery analysis"
          git pull --rebase origin main
          git push
