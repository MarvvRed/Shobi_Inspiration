name: Analyze yellow Social Cards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/analyze_remaining_cards_dynamic.py'
      - '.github/workflows/analyze-yellow-social-cards.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --disable-pip-version-check pillow pytesseract
      - name: Analyze every yellow card
        run: python tools/analyze_remaining_cards_dynamic.py
      - name: Commit recovery report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/audits/remaining-card-dynamic-analysis.json
          if git diff --cached --quiet; then
            echo 'No report changes.'
            exit 0
          fi
          git commit -m 'Analyze yellow Social Card recoverability'
          git push
