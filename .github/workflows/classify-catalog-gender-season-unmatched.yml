name: Classify unmatched catalog Gender and Season
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/catalog-gender-season-unmatched-trigger'
permissions:
  contents: write
jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify unmatched catalog rows
        run: python tools/classify_catalog_gender_season_unmatched.py
      - name: Commit classification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fragrantica-scraper-archive/social-cards/catalog-unmatched-classification.csv
          git add fragrantica-scraper-archive/social-cards/catalog-unmatched-classification.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Classify unmatched catalog Gender and Season rows"
          git pull --rebase origin main
          git push origin HEAD:main
