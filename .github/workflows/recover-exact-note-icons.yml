name: Recover exact Fragrantica note icons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-exact-note-icons.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow requests beautifulsoup4
      - name: Recover exact note images and update local map
        run: |
          python - <<'PY'
          import io
          import json
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          NOTES = {
              'clearwood': ('Clearwood', 816),
              'thailand oud': ('Thailand Oud', 761),
              'ambrinol': ('Ambrinol', 1202),
              'cherry milk': ('Cherry Milk', 1377),
              'sandalwood flower': ('Sandalwood Flower', 1163),
          }
          session = requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (compatible; ShobiInspirationAudit/1.0)'})
          outdir = Path('database/assets/note-icons')
          evidence = []

          def valid_image(data):
              try:
                  im = Image.open(io.BytesIO(data))
                  im.verify()
                  return len(data) > 500
              except Exception:
                  return False

          for key, (name, note_id) in NOTES.items():
              slug = re.sub(r'[^a-z0-9]+', '-', name.lower()).strip('-')
              page = f'https://www.fragrantica.com/notes/{name.replace(" ", "-")}-{note_id}.html'
              r = session.get(page, timeout=30)
              print(name, 'page', r.status_code, r.url)
              r.raise_for_status()
              soup = BeautifulSoup(r.text, 'html.parser')
              candidates = []
              for img in soup.find_all('img'):
                  src = img.get('src') or img.get('data-src') or ''
                  if not src:
                      continue
                  full = urljoin(r.url, src)
                  low = full.lower()
                  alt = (img.get('alt') or '').lower()
                  if str(note_id) in low or name.lower() in alt or slug in low:
                      candidates.append(full)
              candidates += [
                  f'https://fimgs.net/mdimg/sastojci/m.{note_id}.jpg',
                  f'https://fimgs.net/mdimg/sastojci/{note_id}.jpg',
                  f'https://fimgs.net/mdimg/sastojci/t.{note_id}.jpg',
              ]
              seen = set(); chosen = None; chosen_data = None
              for url in candidates:
                  if url in seen: continue
                  seen.add(url)
                  try:
                      ir = session.get(url, timeout=30)
                      ctype = ir.headers.get('content-type','')
                      print(' candidate', url, ir.status_code, ctype, len(ir.content))
                      if ir.ok and valid_image(ir.content):
                          chosen = url; chosen_data = ir.content; break
                  except Exception as exc:
                      print(' candidate error', url, exc)
              if not chosen:
                  raise SystemExit(f'No exact image recovered for {name} ({note_id})')
              im = Image.open(io.BytesIO(chosen_data)).convert('RGB')
              dest = outdir / f'{slug}-{note_id}.webp'
              im.save(dest, 'WEBP', quality=92, method=6)
              evidence.append({'name':name,'noteId':note_id,'sourcePage':r.url,'imageSource':chosen,'localPath':dest.as_posix(),'size':list(im.size)})

          map_path = outdir / 'map.js'
          prefix='window.FRAGRANTICA_NOTE_ICON_MAP='
          text=map_path.read_text(encoding='utf-8').strip()
          assert text.startswith(prefix)
          mapping=json.loads(text[len(prefix):].rstrip(';'))
          for key,(name,note_id) in NOTES.items():
              slug=re.sub(r'[^a-z0-9]+','-',name.lower()).strip('-')
              mapping[key]=f'database/assets/note-icons/{slug}-{note_id}.webp'
          map_path.write_text(prefix+json.dumps(mapping,ensure_ascii=False,separators=(',',':'))+';\n',encoding='utf-8')
          Path('database/audits/recovered-note-icons.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(evidence,ensure_ascii=False,indent=2))
          PY
      - name: Commit exact note icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/assets/note-icons/map.js database/assets/note-icons/*.webp database/audits/recovered-note-icons.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add exact Fragrantica note icons'
          git pull --rebase origin main
          git push
