name: Shobi Identity Online Resolver

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum perfumes to process in this run"
        required: false
        default: "5"
      retry_errors:
        description: "Retry only rows currently in the error ledger"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - ".github/shobi-run-trigger"

permissions:
  contents: write

concurrency:
  group: shobi-identity-online
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove failed first-run auto ambiguities
        if: github.event_name == 'push'
        run: python tools/cleanup_online_ambiguous.py

      - name: Show current resolver stats
        run: python tools/shobi_identity_resolver.py stats

      - name: Resolve Shobi identities online
        shell: bash
        env:
          MANUAL_LIMIT: ${{ github.event.inputs.limit }}
          RETRY_ERRORS: ${{ github.event.inputs.retry_errors }}
        run: |
          set -euo pipefail
          LIMIT="${MANUAL_LIMIT:-5}"
          if [[ -z "$LIMIT" ]]; then LIMIT="5"; fi

          CMD="run"
          if [[ "${RETRY_ERRORS:-false}" == "true" ]]; then
            CMD="retry-errors"
          fi

          python tools/shobi_identity_resolver.py "$CMD" \
            --resolver-cmd "python tools/shobi_online_resolver.py" \
            --limit "$LIMIT" \
            --timeout 90 \
            --retries 2 \
            --retry-delay 4

      - name: Show updated resolver stats
        if: always()
        run: python tools/shobi_identity_resolver.py stats

      - name: Commit durable progress
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/shobi-fragrantica-mapping.csv || true
          git add data/identity-resolver-state.json || true
          git add data/identity-resolver-errors.csv || true
          git add data/identity-review-queue.csv || true

          if git diff --cached --quiet; then
            echo "No resolver progress to commit."
            exit 0
          fi

          git commit -m "Checkpoint Shobi identity resolver progress"
          git push
