name: Reconcile v2 Local Fragrantica IDs
on:
  push:
    paths:
      - '.github/reconcile-v2-local-fragrantica-ids-trigger'
      - 'tools/reconcile_v2_with_local_url_ids.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile IDs with local URL corpus
        run: python tools/reconcile_v2_with_local_url_ids.py
      - name: Commit reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fragrantica-v2-local-id-reconciliation.csv fragrantica-v2-local-id-reconciliation.md
          git diff --cached --quiet || git commit -m 'Reconcile v2 Fragrantica IDs against local URL corpus'
          git push
