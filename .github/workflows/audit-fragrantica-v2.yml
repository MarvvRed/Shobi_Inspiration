name: Audit Fragrantica v2
on:
  push:
    paths:
      - '.github/fragrantica-v2-audit-trigger'
      - 'tools/audit_fragrantica_v2.py'
      - 'perfume-database/catalog/shobi-master-v2-2369.csv'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/audit_fragrantica_v2.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fragrantica-v2-audit.csv fragrantica-v2-audit.md
          git diff --cached --quiet || git commit -m 'Add Fragrantica v2 audit results'
          git pull --rebase origin main
          git push origin main
