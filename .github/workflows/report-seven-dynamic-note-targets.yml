name: Report seven dynamic note targets

on:
  push:
    paths:
      - 'tools/report_seven_dynamic_note_targets.py'
      - '.github/workflows/report-seven-dynamic-note-targets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/report_seven_dynamic_note_targets.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seven-dynamic-note-targets.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Report seven dynamic note targets"
          git pull --rebase origin main
          git push origin HEAD:main
