name: Fix critical Fragrantica identity mappings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-critical-fragrantica-identities.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct source mappings and add regression registry
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          FIXES = {
              '1037-BLG': {
                  'brand': 'Bvlgari', 'name': 'Bvlgari Man', 'fid': '9403',
                  'url': 'https://www.fragrantica.com/perfume/Bvlgari/Bvlgari-Man-9403.html',
                  'reason': 'Correct Bvlgari Man identity; FID 148 is BLV Pour Homme, a different fragrance.'
              },
              '1751-GUL': {
                  'brand': 'Jean Paul Gaultier', 'name': 'Ma Dame', 'fid': '3681',
                  'url': 'https://www.fragrantica.com/perfume/Jean-Paul-Gaultier/Ma-Dame-3681.html',
                  'reason': 'Correct Ma Dame by Jean Paul Gaultier; FID 12088 belongs to Cortina 1224 Madame.'
              },
              '928-TRU': {
                  'brand': 'Trussardi', 'name': 'Trussardi Delicate Rose', 'fid': '16241',
                  'url': 'https://www.fragrantica.com/perfume/Trussardi/Trussardi-Delicate-Rose-16241.html',
                  'reason': 'Correct Trussardi Delicate Rose; FID 93471 belongs to Aurora Scents.'
              },
              '548-CLI': {
                  'brand': 'Clinique', 'name': 'Clinique Happy', 'fid': '372',
                  'url': 'https://www.fragrantica.com/perfume/Clinique/Clinique-Happy-372.html',
                  'reason': 'Correct women Clinique Happy; FID 66133 belongs to The Dua Brand.'
              },
              '1086-CLI': {
                  'brand': 'Clinique', 'name': 'Clinique Happy For Men', 'fid': '373',
                  'url': 'https://www.fragrantica.com/perfume/Clinique/Clinique-Happy-For-Men-373.html',
                  'reason': 'Correct men Clinique Happy; FID 66133 belongs to The Dua Brand.'
              },
              '2194-ORT': {
                  'brand': 'Orto Parisi', 'name': 'Cuoium', 'fid': '69923',
                  'url': 'https://www.fragrantica.com/perfume/Orto-Parisi/Cuoium-69923.html',
                  'reason': 'Shobi 2194-ORT is Cuoium by Orto Parisi; FID 119473 belongs to Al Qasim Oud ORTO.'
              },
          }

          path = Path('database/source/shobi-fragrantica-mapping.csv')
          with path.open(encoding='utf-8-sig', newline='') as handle:
              reader = csv.DictReader(handle)
              fields = reader.fieldnames
              rows = list(reader)

          seen = set()
          changes = []
          for row in rows:
              code = str(row.get('shobi_code') or '').strip().upper()
              fix = FIXES.get(code)
              if not fix:
                  continue
              if code in seen:
                  raise SystemExit(f'Duplicate mapping row for {code}')
              seen.add(code)
              before = {
                  'brand': row.get('original_brand'),
                  'name': row.get('original_perfume'),
                  'fid': row.get('fragrantica_id'),
                  'url': row.get('fragrantica_url'),
              }
              row['original_brand'] = fix['brand']
              row['original_perfume'] = fix['name']
              row['fragrantica_id'] = fix['fid']
              row['fragrantica_url'] = fix['url']
              row['identity_status'] = 'CONFIRMED'
              row['fragrantica_status'] = 'FOUND'
              proof = f"CRITICAL_IDENTITY_FIX: {fix['reason']} Verified URL: {fix['url']}"
              old_note = str(row.get('evidence_note') or '').strip()
              row['evidence_note'] = proof if proof in old_note else (old_note + ' | ' + proof).strip(' |')
              changes.append({'code': code, 'before': before, 'after': fix})

          missing = sorted(set(FIXES) - seen)
          if missing:
              raise SystemExit(f'Missing source rows: {missing}')

          # The two Clinique products must never share one FID again.
          by_code = {str(r.get('shobi_code') or '').strip().upper(): r for r in rows}
          assert by_code['548-CLI']['fragrantica_id'] == '372'
          assert by_code['1086-CLI']['fragrantica_id'] == '373'
          assert by_code['548-CLI']['fragrantica_id'] != by_code['1086-CLI']['fragrantica_id']

          with path.open('w', encoding='utf-8-sig', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=fields, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)

          registry = {
              'rule': 'These identities are regression-locked because stale same-name or related-name mappings previously pointed to the wrong Fragrantica perfume.',
              'rows': [
                  {'code': code, 'brand': fix['brand'], 'name': fix['name'], 'fragranticaId': fix['fid'], 'fragranticaUrl': fix['url'], 'reason': fix['reason']}
                  for code, fix in FIXES.items()
              ]
          }
          Path('database/audits/critical-identity-regression-registry.json').write_text(
              json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          Path('database/audits/critical-identity-fixes.json').write_text(
              json.dumps(changes, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(changes, ensure_ascii=False, indent=2))
          PY
      - name: Commit corrected identity source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/source/shobi-fragrantica-mapping.csv database/audits/critical-identity-regression-registry.json database/audits/critical-identity-fixes.json
          git commit -m 'Correct six critical Fragrantica identities'
          git pull --rebase origin main
          git push
