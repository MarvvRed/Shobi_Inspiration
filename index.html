<!DOCTYPE html>
<html lang="en" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shobi Perfume Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        [data-field="inspiredBy"] { text-transform: uppercase; }
        .brand-badge { display:inline-flex; align-items:center; width:fit-content; padding:.35rem .8rem; border-radius:9999px; font-size:.75rem; font-weight:600; line-height:1rem; border:1px solid #d1d5db; color:#374151; background:#f9fafb; }
        .brand-badge:hover { color:#1d4ed8; background:#eff6ff; border-color:#93c5fd; }
        [data-theme="dark"] .brand-badge { color:#e5e7eb; background:#1f2937; border-color:#4b5563; }
        [data-theme="dark"] .brand-badge:hover { color:#dbeafe; background:#1e3a8a; border-color:#60a5fa; }
        .gender-badge { display:inline-flex; align-items:center; gap:.5rem; width:fit-content; padding:.35rem .85rem; border-radius:9999px; font-size:.875rem; font-weight:600; line-height:1.25rem; border:1px solid #c7d2fe; color:#3730a3; background:#eef2ff; }
        .gender-badge i { font-size:1.125rem; }
        .gender-badge:hover { background:#e0e7ff; border-color:#a5b4fc; }
        [data-theme="dark"] .gender-badge { color:#eef2ff; background:#3730a3; border-color:#818cf8; }
        [data-theme="dark"] .gender-badge:hover { color:#111827; background:#a5b4fc; border-color:#c7d2fe; }
        .main-note-badge { display:inline-flex; align-items:center; gap:.4rem; min-width:0; }
        .main-note-icon { width:20px; height:20px; flex:0 0 20px; object-fit:cover; border-radius:50%; }
        .top-control { display:inline-flex; align-items:center; gap:.5rem; height:38px; padding:0 .8rem; border:1px solid #d1d5db; border-radius:.75rem; background:var(--surface, #fff); color:inherit; }
        .top-control:hover { background:rgba(148,163,184,.10); }
        .results-pill { white-space:nowrap; font-size:.8rem; font-weight:600; color:#64748b; }
        #theme-menu-dropdown { min-width:180px; border:1px solid rgba(148,163,184,.25); }
        #theme-menu-btn .fa-chevron-down { font-size:.65rem; opacity:.7; }
        #favorites-btn { border-color:#fecdd3; color:#be123c; background:transparent; box-shadow:none; }
        #favorites-btn:hover { background:#fff1f2; border-color:#fda4af; }
        [data-theme="dark"] #favorites-btn { color:#fda4af; border-color:#7f1d1d; }
        [data-theme="dark"] #favorites-btn:hover { background:#3f0d18; }
        .v2-test-card .v2-test-top { display:grid; grid-template-columns:96px minmax(0,1fr); gap:14px; align-items:start; margin-bottom:1.15rem; }
        .v2-test-card .v2-test-image-wrap { width:96px; height:128px; border-radius:14px; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#f8fafc; border:1px solid rgba(148,163,184,.22); }
        .v2-test-card .v2-test-image { width:100%; height:100%; object-fit:contain; display:block; }
        .v2-test-card .v2-test-info { min-width:0; display:flex; flex-direction:column; align-items:flex-start; }
        .v2-test-card [data-field="inspiredBy"] { font-size:1.18rem; line-height:1.35rem; margin-bottom:.75rem; }
        .v2-test-card .brand-badge { margin-bottom:.65rem; max-width:100%; padding:.42rem .9rem; font-size:.82rem; line-height:1.05rem; }
        .v2-test-card .gender-badge { padding:.3rem .72rem; font-size:.82rem; line-height:1.05rem; }
        .v2-test-card .gender-badge i { font-size:1rem; }
        .v2-test-card [data-field="audience-icons"] { margin-bottom:0; }
        .v2-test-card [data-field="code"] { display:none; }
        .v2-test-card > div > div.mb-4 > p { font-size:1rem; line-height:1.2rem; margin-bottom:.72rem; }
        .v2-test-card [data-field="main-notes"] .main-note-badge { padding:.38rem .72rem; font-size:.82rem; line-height:1.05rem; gap:.5rem; }
        .v2-test-card [data-field="main-notes"] .main-note-icon { width:25px; height:25px; flex-basis:25px; }
        [data-theme="dark"] .v2-test-card .v2-test-image-wrap { background:#111827; border-color:#374151; }
    </style>
</head>
<body class="bg-base font-sans">
<nav class="bg-surface shadow-md sticky top-0 z-10"><div class="mx-auto px-4 sm:px-6 lg:px-8"><div class="flex justify-between h-16"><div class="flex-shrink-0 flex items-center"><i class="fas fa-spray-can-sparkles text-blue-600 text-xl mr-2"></i><span class="font-bold text-lg text-primary">Shobi Perfume Inspiration</span></div><div class="flex items-center gap-3"><div id="results-count" class="results-pill hidden md:block">Loading perfumes...</div><div class="relative" id="theme-switcher"><button id="theme-menu-btn" class="top-control text-sm font-medium text-secondary" title="Change theme"><i class="fas fa-circle-half-stroke"></i><span class="hidden sm:inline">Theme</span><i class="fas fa-chevron-down"></i></button><div id="theme-menu-dropdown" class="hidden absolute right-0 mt-2 bg-surface rounded-xl shadow-xl z-20 overflow-hidden"><button data-theme="light" class="theme-btn block w-full text-left px-4 py-2.5 text-sm text-secondary hover:bg-base"><i class="fas fa-sun w-5 mr-2"></i>Default</button><button data-theme="dark" class="theme-btn block w-full text-left px-4 py-2.5 text-sm text-secondary hover:bg-base"><i class="fas fa-moon w-5 mr-2"></i>Shobi Dark</button><button data-theme="sepia" class="theme-btn block w-full text-left px-4 py-2.5 text-sm text-secondary hover:bg-base"><i class="fas fa-book-open w-5 mr-2"></i>Sepia</button><button data-theme="blue" class="theme-btn block w-full text-left px-4 py-2.5 text-sm text-secondary hover:bg-base"><i class="fas fa-droplet w-5 mr-2"></i>Shobi Blue</button></div></div><button id="favorites-btn" class="top-control text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-rose-300"><i class="fa-regular fa-heart"></i><span class="hidden sm:inline">Favorites</span><span id="favorites-count" class="min-w-5 h-5 inline-flex items-center justify-center rounded-full bg-rose-100 text-rose-700 text-xs font-bold px-1.5">0</span></button></div></div></div></nav>
<div class="page-grid mx-auto p-4 sm:p-6 lg:p-8 gap-6"><aside id="filter-sidebar" class="bg-surface rounded-lg shadow-lg h-fit lg:sticky top-24"><button id="filters-toggle-btn" class="lg:hidden w-full flex justify-between items-center p-4"><h3 class="text-xl font-bold text-primary">Filters</h3><i id="filters-toggle-icon" class="fas fa-chevron-down transition-transform text-secondary"></i></button><div id="filters-content" class="hidden lg:block p-6 lg:p-0"><div class="hidden lg:flex justify-between items-center mb-4 lg:pt-6 lg:px-6"><h3 class="text-xl font-bold text-primary">Filters</h3><button id="reset-all-filters-btn-desktop" title="Clear all filters" class="text-sm text-accent text-accent-hover">Clear All</button></div><button id="reset-all-filters-btn-mobile" class="lg:hidden w-full text-center text-sm text-accent text-accent-hover mb-4">Clear All Filters</button><div class="filter-group mb-6 lg:px-6"><h4 class="font-semibold text-primary mb-2">Gender</h4><div id="gender-filters" class="space-y-2"></div></div><div class="filter-group mb-6 lg:px-6"><h4 class="font-semibold text-primary mb-2">Brand</h4><div id="brand-filters" class="space-y-2 max-h-64 overflow-y-auto pr-2"><div id="brand-loader" class="text-sm text-tertiary">Loading brands...</div></div></div><div class="filter-group mb-6 lg:px-6"><h4 class="font-semibold text-primary mb-2">Season</h4><div id="season-filters" class="space-y-2"><div id="season-loader" class="text-sm text-tertiary">Loading filters...</div></div></div><div class="filter-group lg:px-6 lg:pb-6"><h4 class="font-semibold text-primary mb-2">Main Accords</h4><div id="accord-filters" class="space-y-2 max-h-64 overflow-y-auto pr-2"><div id="accord-loader" class="text-sm text-tertiary">Loading filters...</div></div></div></div></aside><main id="main-content"><section class="w-full mb-6"><div class="relative"><span class="absolute inset-y-0 left-0 pl-3 flex items-center"><i class="fas fa-search text-placeholder-color"></i></span><input type="text" id="search-input" class="block w-full pl-10 pr-4 py-3 border-base rounded-md leading-5 bg-surface placeholder-color text-primary focus-ring sm:text-lg" placeholder="Search by name, brand, or code..."></div></section><div id="brand-info-container" class="hidden"><div id="brand-info-content"></div><button id="clear-brand-filter" class="hidden">Clear</button></div><div id="active-filters-display" class="mb-4 flex flex-wrap gap-2"></div><div class="mb-4 flex justify-end"><label for="sort-select" class="flex items-center gap-2 text-sm font-medium text-secondary"><span>Sort by</span><select id="sort-select" class="border-base rounded-md bg-surface px-3 py-2 text-primary focus-ring" aria-label="Sort perfumes"><option value="brand">Brand</option><option value="name">Name</option><option value="best-seller">Best seller</option></select></label></div><div id="resultsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-6"></div></main></div>
<template id="perfume-card-template"><div class="bg-surface rounded-lg shadow-lg overflow-hidden flex flex-col transition-transform duration-200 hover:scale-[1.03]"><div class="p-5 relative flex-grow flex flex-col"><div><h3 class="text-lg font-bold text-primary mb-1" data-field="inspiredBy">PERFUME NAME</h3><p class="text-xs font-mono text-tertiary mb-1" data-field="code">DRC-123</p></div><button data-action="filter-brand" data-brand="" class="brand-badge mb-3 text-left transition focus-ring" data-field="brand" title="Filter by brand">Brand Name</button><div data-field="audience-icons" class="flex flex-wrap gap-2 text-base mb-3"></div><div class="mb-4"><p class="mb-2 text-xs font-semibold uppercase tracking-wide text-tertiary">Main Notes</p><div data-field="main-notes" class="space-y-2"></div></div><div class="mt-auto space-y-2"><a data-field="shobiLink" href="#" target="_blank" rel="noopener noreferrer" class="block w-full text-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Buy at Shobi</a><div class="grid grid-cols-2 gap-2"><button class="favorite-btn w-full text-center px-3 py-2 border border-red-500 rounded-md shadow-sm text-sm font-medium text-red-600 bg-surface hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500"><i class="fa-regular fa-heart mr-2"></i><span class="favorite-label">Favorite</span></button><button type="button" class="collection-btn w-full text-center px-3 py-2 border border-emerald-500 rounded-md shadow-sm text-sm font-medium text-emerald-700 bg-surface cursor-default" title="In collection"><i class="fas fa-box-open mr-2"></i><span>Collection</span></button></div></div></div></div></template>
<script src="script.js"></script>
<script>(()=>{displayBrandInfo=function(){};handleBrandFilterClick=function(brandName){state.selectedBrand=null;state.showingFavorites=false;state.activeFilters.brands=[brandName];document.querySelectorAll('#brand-filters input[type="checkbox"]').forEach(cb=>cb.checked=cb.value===brandName);applyFiltersAndRender();};const escapeRegExp=value=>String(value).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const removeBrandFromPerfumeName=(name,brand)=>{const originalName=String(name||'').trim();const brandName=String(brand||'').trim();if(!originalName||!brandName||brandName==='Unknown Brand')return originalName;const brandTokens=brandName.split(/[\s._\-–—/|,:;·&+'’]+/).filter(Boolean);if(!brandTokens.length)return originalName;const brandPattern=brandTokens.map(escapeRegExp).join('[\\s._\\-–—/|,:;·&+\'’]*');const boundary='[\\s._\\-–—/|,:;·&+\'’]';const withoutBrand=originalName.replace(new RegExp(`(^|${boundary})${brandPattern}(?=$|${boundary})`,'gi'),'$1 ').replace(/\s+/g,' ').replace(/^\s*[-–—|/:,;]+\s*/,'').replace(/\s*[-–—|/:,;]+\s*$/,'').trim();return withoutBrand||originalName;};const cleanPerfumeName=name=>String(name||'').replace(/[-–—]+/g,' ').replace(/\s+/g,' ').trim();const originalApplyFiltersAndRender=applyFiltersAndRender;applyFiltersAndRender=function(...args){allPerfumes.forEach(perfume=>{perfume.inspiredBy=cleanPerfumeName(removeBrandFromPerfumeName(perfume.inspiredBy,perfume.brand)).toUpperCase();});return originalApplyFiltersAndRender.apply(this,args);};const originalDisplayPerfumes=displayPerfumes;const restoreFavoriteButton=btn=>{const isFavorite=btn.classList.contains('is-favorite');btn.innerHTML=`<i class="${isFavorite?'fa-solid':'fa-regular'} fa-heart mr-2"></i><span class="favorite-label">${isFavorite?'Favorited':'Favorite'}</span>`;};const applyV2Card=card=>{if(!card||card.classList.contains('v2-test-card'))return;const body=card.firstElementChild;const title=card.querySelector('[data-field="inspiredBy"]');const code=card.querySelector('[data-field="code"]');const brand=card.querySelector('[data-field="brand"]');const audience=card.querySelector('[data-field="audience-icons"]');const notes=card.querySelector('[data-field="main-notes"]')?.parentElement;const shobi=card.querySelector('[data-field="shobiLink"]');if(!body||!title||!brand||!audience||!notes)return;card.classList.add('v2-test-card');const oldHeader=title.parentElement;const top=document.createElement('div');top.className='v2-test-top';const imageWrap=document.createElement('div');imageWrap.className='v2-test-image-wrap';const image=document.createElement('img');image.className='v2-test-image';image.src='https://fimgs.net/mdimg/perfume-thumbs/dark-375x500.52616.avif';image.alt='Perfume bottle placeholder';image.loading='lazy';imageWrap.appendChild(image);const info=document.createElement('div');info.className='v2-test-info';info.appendChild(title);info.appendChild(brand);info.appendChild(audience);top.appendChild(imageWrap);top.appendChild(info);body.insertBefore(top,notes);if(code)code.remove();if(oldHeader&&oldHeader!==info&&oldHeader.childElementCount===0)oldHeader.remove();const notesLabel=notes.querySelector('p');if(notesLabel)notesLabel.textContent='Main notes';if(shobi)shobi.textContent='View on Shobi';};const applyV2Cards=()=>document.querySelectorAll('#resultsContainer > div').forEach(applyV2Card);displayPerfumes=function(perfumes){originalDisplayPerfumes(perfumes);document.querySelectorAll('#resultsContainer .favorite-btn').forEach(btn=>{restoreFavoriteButton(btn);btn.addEventListener('click',()=>restoreFavoriteButton(btn));});applyV2Cards();};const normalizeNoteName=note=>String(note||'').trim().toLowerCase().replace(/\s+/g,' ');const FRAGRANTICA_NOTE_IDS={'grapefruit':76,'lemon':77,'mint':160,'pink pepper':91,'ginger':62,'cardamom':63,'tonic water':660,'woody notes':315,'caramel':183,'myrtle':328,'mandarin orange':82,'mandarin':82,'spearmint':1565,'musk':4,'gin':299,'resins':317,'cedar':41,'cedarwood':41,'cedar wood':41,'pepper':158,'black pepper':158,'vetiver':2,'sea water':324,'sea notes':324,'sandalwood':33,'basil':119};const getFragranticaNoteIcon=note=>{const id=FRAGRANTICA_NOTE_IDS[normalizeNoteName(note)];if(!id)return'';return `<img class="main-note-icon" src="https://fimgs.net/mdimg/sastojci/m.${id}.jpg" alt="" aria-hidden="true" loading="lazy" onerror="this.remove()">`;};getMainNotesBadges=function(notes){const mainNotes=getPerfumeNotes(notes).slice(0,6);const slotCount=Math.max(mainNotes.length,3);const rowCounts=slotCount===6?[2,2,2]:slotCount===5?[2,2,1]:slotCount===4?[2,1,1]:[1,1,1];const slots=[...mainNotes];while(slots.length<slotCount)slots.push(null);let offset=0;return rowCounts.map(count=>{const row=slots.slice(offset,offset+count);offset+=count;return `<div class="flex gap-2 min-h-[28px]">${row.map(note=>{if(!note)return '<span aria-hidden="true" class="main-note-badge invisible rounded-full px-3 py-1 text-xs font-medium">Empty</span>';const value=escapeHtml(note);const label=escapeHtml(note);const icon=getFragranticaNoteIcon(note);return `<button type="button" data-action="filter-icon" data-filter-type="note" data-filter-value="${value}" class="main-note-badge rounded-full px-3 py-1 text-xs font-medium transition focus-ring" title="Filter by ${label}">${icon}<span>${label}</span></button>`;}).join('')}</div>`;}).join('');};getAudienceIcons=function(audience){const a=String(audience||'').toLowerCase();if(!a)return'';const badges=[];if(a.includes('male')||a.includes('masculine')||a.includes('men'))badges.push({value:'masculine',label:'Male',iconHtml:'<i class="fas fa-mars text-blue-600" title="Masculine"></i>'});if(a.includes('female')||a.includes('feminine')||a.includes('women'))badges.push({value:'feminine',label:'Female',iconHtml:'<i class="fas fa-venus text-red-600" title="Feminine"></i>'});if(a.includes('unisex'))badges.push({value:'unisex',label:'Unisex',iconHtml:'<i class="fas fa-venus-mars text-green-600" title="Unisex"></i>'});return badges.map(b=>`<button type="button" class="gender-badge" data-action="filter-icon" data-filter-type="gender" data-filter-value="${b.value}" title="Filter by ${b.label}">${b.iconHtml}<span>${b.label}</span></button>`).join('');};const originalPopulateFilters=populateFilters;populateFilters=function(...args){const result=originalPopulateFilters.apply(this,args);const labels={masculine:'Male',feminine:'Female',unisex:'Unisex'};document.querySelectorAll('#gender-filters label').forEach(label=>{const input=label.querySelector('input[name="gender"]');if(!input||!labels[input.value])return;while(input.nextSibling)input.nextSibling.remove();label.append(document.createTextNode(` ${labels[input.value]}`));});return result;};})();</script>
