<!DOCTYPE html>
<html lang="en" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shobi Perfume Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        [data-field="inspiredBy"] { text-transform: uppercase; }
        .gender-badge { display:inline-flex; align-items:center; gap:.5rem; width:fit-content; padding:.35rem .85rem; border-radius:9999px; font-size:.875rem; font-weight:600; line-height:1.25rem; border:1px solid #c7d2fe; color:#3730a3; background:#eef2ff; }
        .gender-badge i { font-size:1.125rem; }
        .gender-badge:hover { background:#e0e7ff; border-color:#a5b4fc; }
        [data-theme="dark"] .gender-badge { color:#eef2ff; background:#3730a3; border-color:#818cf8; }
        [data-theme="dark"] .gender-badge:hover { color:#111827; background:#a5b4fc; border-color:#c7d2fe; }
    </style>
</head>
<body class="bg-base font-sans">
<nav class="bg-surface shadow-md sticky top-0 z-10"><div class="mx-auto px-4 sm:px-6 lg:px-8"><div class="flex justify-between h-16"><div class="flex-shrink-0 flex items-center"><i class="fas fa-spray-can-sparkles text-blue-600 text-xl mr-2"></i><span class="font-bold text-lg text-primary">Shobi Perfume Inspiration</span></div><div class="flex items-center space-x-4"><div class="relative" id="theme-switcher"><button id="theme-menu-btn" class="flex items-center text-secondary text-accent-hover" title="Change theme"><i class="fas fa-palette text-lg"></i><span class="hidden sm:inline-block ml-2 text-sm font-medium">Theme</span></button><div id="theme-menu-dropdown" class="hidden absolute right-0 mt-2 w-36 bg-surface rounded-md shadow-lg z-20"><button data-theme="light" class="theme-btn block w-full text-left px-4 py-2 text-sm text-secondary hover:bg-base"><i class="fas fa-sun w-5 mr-1"></i> Default</button><button data-theme="dark" class="theme-btn block w-full text-left px-4 py-2 text-sm text-secondary hover:bg-base"><i class="fas fa-moon w-5 mr-1"></i> Shobi Dark</button><button data-theme="sepia" class="theme-btn block w-full text-left px-4 py-2 text-sm text-secondary hover:bg-base"><i class="fas fa-book w-5 mr-1"></i> Sepia</button><button data-theme="blue" class="theme-btn block w-full text-left px-4 py-2 text-sm text-secondary hover:bg-base"><i class="fas fa-tint w-5 mr-1"></i> Shobi Blue</button></div></div><button id="favorites-btn" class="flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500"><i class="fas fa-heart mr-2"></i>Favorites<span id="favorites-count" class="ml-2 bg-white text-red-600 text-xs font-bold rounded-full px-2 py-0.5">0</span></button></div></div></div></nav>
<div class="page-grid mx-auto p-4 sm:p-6 lg:p-8 gap-6"><aside id="filter-sidebar" class="bg-surface rounded-lg shadow-lg h-fit lg:sticky top-24"><button id="filters-toggle-btn" class="lg:hidden w-full flex justify-between items-center p-4"><h3 class="text-xl font-bold text-primary">Filters</h3><i id="filters-toggle-icon" class="fas fa-chevron-down transition-transform text-secondary"></i></button><div id="filters-content" class="hidden lg:block p-6 lg:p-0"><div class="hidden lg:flex justify-between items-center mb-4 lg:pt-6 lg:px-6"><h3 class="text-xl font-bold text-primary">Filters</h3><button id="reset-all-filters-btn-desktop" title="Clear all filters" class="text-sm text-accent text-accent-hover">Clear All</button></div><button id="reset-all-filters-btn-mobile" class="lg:hidden w-full text-center text-sm text-accent text-accent-hover mb-4">Clear All Filters</button><div class="filter-group mb-6 lg:px-6"><h4 class="font-semibold text-primary mb-2">Gender</h4><div id="gender-filters" class="space-y-2"></div></div><div class="filter-group mb-6 lg:px-6"><h4 class="font-semibold text-primary mb-2">Brand</h4><div id="brand-filters" class="space-y-2 max-h-64 overflow-y-auto pr-2"><div id="brand-loader" class="text-sm text-tertiary">Loading brands...</div></div></div><div class="filter-group mb-6 lg:px-6"><h4 class="font-semibold text-primary mb-2">Season</h4><div id="season-filters" class="space-y-2"><div id="season-loader" class="text-sm text-tertiary">Loading filters...</div></div></div><div class="filter-group mb-6 lg:px-6"><h4 class="font-semibold text-primary mb-2">Occasion</h4><div id="occasion-filters" class="space-y-2 max-h-64 overflow-y-auto pr-2"><div id="occasion-loader" class="text-sm text-tertiary">Loading filters...</div></div></div><div class="filter-group lg:px-6 lg:pb-6"><h4 class="font-semibold text-primary mb-2">Main Accords</h4><div id="accord-filters" class="space-y-2 max-h-64 overflow-y-auto pr-2"><div id="accord-loader" class="text-sm text-tertiary">Loading filters...</div></div></div></div></aside><main id="main-content"><section class="w-full mb-6"><div class="relative"><span class="absolute inset-y-0 left-0 pl-3 flex items-center"><i class="fas fa-search text-placeholder-color"></i></span><input type="text" id="search-input" class="block w-full pl-10 pr-4 py-3 border-base rounded-md leading-5 bg-surface placeholder-color text-primary focus-ring sm:text-lg" placeholder="Search by name, brand, or code..."></div></section><div id="brand-info-container" class="hidden bg-accent-subtle border-l-4 border-accent p-6 rounded-md shadow-md mb-6"><div id="brand-info-content" class="text-primary"></div><button id="clear-brand-filter" class="mt-4 text-sm font-medium text-accent text-accent-hover">&times; Clear filter and show all</button></div><div id="active-filters-display" class="mb-4 flex flex-wrap gap-2"></div><div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"><div id="results-count" class="text-secondary">Loading perfumes...</div><label for="sort-select" class="flex items-center gap-2 text-sm font-medium text-secondary sm:ml-auto"><span>Sort by</span><select id="sort-select" class="border-base rounded-md bg-surface px-3 py-2 text-primary focus-ring" aria-label="Sort perfumes"><option value="brand">Brand</option><option value="name">Name</option><option value="best-seller">Best seller</option></select></label></div><div id="resultsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-6"></div></main></div>
<template id="perfume-card-template"><div class="bg-surface rounded-lg shadow-lg overflow-hidden flex flex-col transition-transform duration-200 hover:scale-[1.03]"><div class="p-5 relative flex-grow flex flex-col"><div><h3 class="text-lg font-bold text-primary mb-1" data-field="inspiredBy">PERFUME NAME</h3><p class="text-xs font-mono text-tertiary mb-1" data-field="code">DRC-123</p></div><button data-action="filter-brand" data-brand="" class="text-sm text-secondary mb-3 text-left hover:underline" data-field="brand">Brand Name</button><div data-field="audience-icons" class="flex flex-wrap gap-2 text-base mb-3"></div><div class="mb-4"><p class="mb-2 text-xs font-semibold uppercase tracking-wide text-tertiary">Main Notes</p><div data-field="main-notes" class="flex flex-wrap gap-2"></div></div><div class="mt-auto space-y-2"><a data-field="shobiLink" href="#" target="_blank" rel="noopener noreferrer" class="block w-full text-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Buy at Shobi</a><div class="grid grid-cols-2 gap-2"><button class="favorite-btn w-full text-center px-3 py-2 border border-red-500 rounded-md shadow-sm text-sm font-medium text-red-600 bg-surface hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500"><i class="fa-regular fa-heart mr-2"></i><span class="favorite-label">Favorite</span></button><button type="button" class="collection-btn w-full text-center px-3 py-2 border border-emerald-500 rounded-md shadow-sm text-sm font-medium text-emerald-700 bg-surface cursor-default" title="In collection"><i class="fas fa-box-open mr-2"></i><span>Collection</span></button></div></div></div></div></template>
<script src="script.js"></script>
<script>(()=>{const escapeRegExp=value=>String(value).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const removeBrandFromPerfumeName=(name,brand)=>{const originalName=String(name||'').trim();const brandName=String(brand||'').trim();if(!originalName||!brandName||brandName==='Unknown Brand')return originalName;const brandPattern=brandName.split(/\s+/).map(escapeRegExp).join('\\s+');const withoutBrand=originalName.replace(new RegExp(brandPattern,'gi'),' ').replace(/\s+/g,' ').replace(/^\s*[-–—|/:,;]+\s*/,'').replace(/\s*[-–—|/:,;]+\s*$/,'').trim();return withoutBrand||originalName;};const cleanPerfumeName=name=>String(name||'').replace(/[-–—]+/g,' ').replace(/\s+/g,' ').trim();const originalApplyFiltersAndRender=applyFiltersAndRender;applyFiltersAndRender=function(...args){allPerfumes.forEach(perfume=>{perfume.inspiredBy=cleanPerfumeName(removeBrandFromPerfumeName(perfume.inspiredBy,perfume.brand)).toUpperCase();});return originalApplyFiltersAndRender.apply(this,args);};const originalDisplayPerfumes=displayPerfumes;const restoreFavoriteButton=btn=>{const isFavorite=btn.classList.contains('is-favorite');btn.innerHTML=`<i class="${isFavorite?'fa-solid':'fa-regular'} fa-heart mr-2"></i><span class="favorite-label">${isFavorite?'Favorited':'Favorite'}</span>`;};displayPerfumes=function(perfumes){originalDisplayPerfumes(perfumes);document.querySelectorAll('#resultsContainer .favorite-btn').forEach(btn=>{restoreFavoriteButton(btn);btn.addEventListener('click',()=>restoreFavoriteButton(btn));});};getAudienceIcons=function(audience){const a=String(audience||'').toLowerCase();if(!a)return'';const badges=[];if(a.includes('male')||a.includes('masculine')||a.includes('men'))badges.push({value:'masculine',label:'Male',iconHtml:'<i class="fas fa-mars text-blue-600" title="Masculine"></i>'});if(a.includes('female')||a.includes('feminine')||a.includes('women'))badges.push({value:'feminine',label:'Female',iconHtml:'<i class="fas fa-venus text-red-600" title="Feminine"></i>'});if(a.includes('unisex'))badges.push({value:'unisex',label:'Unisex',iconHtml:'<i class="fas fa-venus-mars text-green-600" title="Unisex"></i>'});return badges.map(b=>`<button type="button" class="gender-badge" data-action="filter-icon" data-filter-type="gender" data-filter-value="${b.value}" title="Filter by ${b.label}">${b.iconHtml}<span>${b.label}</span></button>`).join('');};const originalPopulateFilters=populateFilters;populateFilters=function(...args){const result=originalPopulateFilters.apply(this,args);const labels={masculine:'Male',feminine:'Female',unisex:'Unisex'};document.querySelectorAll('#gender-filters label').forEach(label=>{const input=label.querySelector('input[name="gender"]');if(!input||!labels[input.value])return;while(input.nextSibling)input.nextSibling.remove();label.append(document.createTextNode(` ${labels[input.value]}`));});return result;};})();</script>
</body>
</html>
